<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Stream · Coverage · SIGA</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap');
  :root {
    --green: #00f593;
    --green-dark: #003d22;
    --red: #ff4060;
    --red-dark: #3d0010;
    --yellow: #f5a623;
    --yellow-dark: #3d2a00;
    --bg: #0d0d1a;
    --card-bg: #12122a;
    --card-border: #1e1e40;
    --text: #c8c8e0;
    --muted: #6b6b8a;
    --accent: #00bcd4;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }

  /* === SCANLINES === */
  body::after {
    content: '';
    position: fixed; top: 0; left: 0; width: 100%; height: 100%;
    background: repeating-linear-gradient(
      0deg,
      transparent,
      transparent 2px,
      rgba(0,0,0,0.08) 2px,
      rgba(0,0,0,0.08) 4px
    );
    pointer-events: none; z-index: 999;
  }

  body {
    font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
    background: var(--bg);
    color: var(--text);
    padding: 2rem;
    min-height: 100vh;
    position: relative;
  }

  /* === HEADER STREAM === */
  .stream-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    flex-wrap: wrap;
    gap: 1rem;
    margin-bottom: 2rem;
    border-bottom: 1px solid var(--card-border);
    padding-bottom: 1.25rem;
  }
  .stream-header h1 {
    font-size: 1.75rem;
    font-weight: 800;
    color: #fff;
    letter-spacing: 0.5px;
  }
  .stream-header h1 span { color: var(--accent); }
  .live-indicator {
    display: flex;
    align-items: center;
    gap: 0.5rem;
    font-size: 0.8rem;
    font-weight: 700;
    color: var(--green);
    text-transform: uppercase;
    letter-spacing: 1px;
  }
  .live-dot {
    width: 10px; height: 10px;
    background: var(--green);
    border-radius: 50%;
    animation: pulse 1.5s ease-in-out infinite;
  }
  @keyframes pulse {
    0%, 100% { opacity: 1; box-shadow: 0 0 0 0 rgba(0,245,147,0.6); }
    50% { opacity: 0.6; box-shadow: 0 0 0 8px rgba(0,245,147,0); }
  }

  .subtitle {
    color: var(--muted);
    font-size: 0.9rem;
    width: 100%;
    margin-top: 0.25rem;
  }

  /* === STATS BAR === */
  .stats-bar {
    display: flex;
    gap: 2rem;
    flex-wrap: wrap;
    margin-bottom: 2rem;
    padding: 1rem 1.25rem;
    background: var(--card-bg);
    border: 1px solid var(--card-border);
    border-radius: 10px;
    font-size: 0.85rem;
  }
  .stats-bar .stat {
    display: flex;
    align-items: center;
    gap: 0.5rem;
  }
  .stats-bar .stat strong {
    font-size: 1.2rem;
    color: #fff;
  }
  .stats-bar .stat .dot {
    width: 8px; height: 8px; border-radius: 2px; display: inline-block;
  }
  .dot.inst { background: var(--green); }
  .dot.bran { background: var(--yellow); }
  .dot.line { background: var(--accent); }

  .target-badge {
    margin-left: auto;
    background: var(--green-dark);
    color: var(--green);
    padding: 0.25rem 1rem;
    border-radius: 20px;
    font-weight: 700;
    font-size: 0.8rem;
    border: 1px solid rgba(0,245,147,0.2);
  }

  /* === GRID === */
  .grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(340px, 1fr));
    gap: 1rem;
  }

  .card {
    background: var(--card-bg);
    border: 1px solid var(--card-border);
    border-radius: 10px;
    padding: 1.25rem 1.5rem;
    transition: border-color 0.2s, transform 0.2s;
    position: relative;
    overflow: hidden;
  }
  .card:hover {
    border-color: var(--accent);
    transform: translateY(-2px);
  }
  .card-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 1rem;
  }
  .card-header h2 {
    font-size: 1.1rem;
    font-weight: 700;
    color: #fff;
  }
  .badge {
    font-size: 0.7rem;
    font-weight: 700;
    padding: 0.2rem 0.7rem;
    border-radius: 20px;
    letter-spacing: 0.5px;
  }
  .badge.pass  { background: var(--green-dark); color: var(--green); border: 1px solid rgba(0,245,147,0.2); }
  .badge.fail  { background: var(--red-dark);   color: var(--red);   border: 1px solid rgba(255,64,96,0.2); }
  .badge.near  { background: var(--yellow-dark); color: var(--yellow); border: 1px solid rgba(245,166,35,0.2); }

  .stat-row {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 0.3rem;
    font-size: 0.8rem;
  }
  .stat-label { color: var(--muted); }
  .stat-value { font-weight: 700; font-variant-numeric: tabular-nums; }

  .bar-track {
    height: 6px;
    background: #1a1a35;
    border-radius: 3px;
    overflow: hidden;
    margin-bottom: 0.7rem;
  }
  .bar-fill {
    height: 100%;
    border-radius: 3px;
    transition: width 1s ease;
    position: relative;
  }
  .bar-fill.green  { background: linear-gradient(90deg, #00b86b, var(--green)); }
  .bar-fill.yellow { background: linear-gradient(90deg, #c47f00, var(--yellow)); }
  .bar-fill.red    { background: linear-gradient(90deg, #cc0030, var(--red)); }

  .card-footer {
    margin-top: 0.8rem;
    padding-top: 0.7rem;
    border-top: 1px solid var(--card-border);
    display: flex;
    justify-content: space-between;
    align-items: center;
  }
  .card-footer a {
    color: var(--accent);
    text-decoration: none;
    font-size: 0.8rem;
    font-weight: 600;
    transition: color 0.2s;
  }
  .card-footer a:hover { color: #80eaff; }
  .card-footer .total-stats {
    font-size: 0.75rem;
    color: var(--muted);
  }

  .meta-line {
    margin-top: 1.5rem;
    padding: 1rem 1.25rem;
    background: var(--card-bg);
    border: 1px solid var(--card-border);
    border-radius: 10px;
    font-size: 0.85rem;
    color: var(--muted);
    line-height: 1.6;
  }

  /* === RESPONSIVE === */
  @media (max-width: 600px) {
    body { padding: 1rem; }
    .grid { grid-template-columns: 1fr; }
    .stream-header h1 { font-size: 1.4rem; }
    .stats-bar { flex-direction: column; gap: 0.5rem; }
    .target-badge { margin-left: 0; }
  }
</style>
</head>
<body>

<div class="stream-header">
  <div>
    <h1>◉ <span>Stream</span> · Coverage</h1>
    <div class="subtitle">Dashboard en vivo de cobertura de pruebas por microservicio</div>
  </div>
  <div class="live-indicator">
    <span class="live-dot"></span> Live
  </div>
</div>

<div class="stats-bar" id="statsBar">
  <div class="stat"><span class="dot inst"></span> Instructions: <strong id="avgInstr">--</strong>%</div>
  <div class="stat"><span class="dot bran"></span> Branches: <strong id="avgBranch">--</strong>%</div>
  <div class="stat"><span class="dot line"></span> Lines: <strong id="avgLine">--</strong>%</div>
  <div class="target-badge">🎯 meta: 80%</div>
</div>

<div class="grid" id="grid"></div>

<div class="meta-line" id="meta"></div>

<script>
const services = [
  { name: "auth",      fullName: "Auth Service",
    instr: 78, branch: 58, line: 83,
    totalInstr: 5443, totalBranch: 294, totalLine: 836,
    reportPath: "services/auth/build/reports/jacoco/test/html/index.html",
    icon: "🔐" },
  { name: "agent",     fullName: "Agent Service",
    instr: 82, branch: 48, line: 87,
    totalInstr: 3796, totalBranch: 212, totalLine: 619,
    reportPath: "services/agent/build/reports/jacoco/test/html/index.html",
    icon: "🤖" },
  { name: "billing",   fullName: "Billing Service",
    instr: 10, branch: 0,  line: 10,
    totalInstr: 4327, totalBranch: 126, totalLine: 630,
    reportPath: "services/billing/build/reports/jacoco/test/html/index.html",
    icon: "💰" },
  { name: "inventory", fullName: "Inventory Service",
    instr: 88, branch: 63, line: 93,
    totalInstr: 5910, totalBranch: 248, totalLine: 1003,
    reportPath: "services/inventory/build/reports/jacoco/test/html/index.html",
    icon: "📦" },
  { name: "sales",     fullName: "Sales Service",
    instr: 75, branch: 43, line: 81,
    totalInstr: 4007, totalBranch: 146, totalLine: 578,
    reportPath: "services/sales/build/reports/jacoco/test/html/index.html",
    icon: "🛒" }
];

function barColor(pct) {
  if (pct >= 80) return 'green';
  if (pct >= 50) return 'yellow';
  return 'red';
}
function fmt(n) { return n.toString().replace(/\B(?=(\d{3})+(?!\d))/g, ","); }

const grid = document.getElementById('grid');
let pass80 = 0;

services.forEach(s => {
  const passes80 = s.instr >= 80;
  if (passes80) pass80++;

  const badgeClass = passes80 ? 'pass' : (s.instr >= 60 ? 'near' : 'fail');
  const badgeText  = passes80 ? '✓ 80%+' : s.instr + '%';

  const card = document.createElement('div');
  card.className = 'card';
  card.innerHTML = `
    <div class="card-header">
      <h2>${s.icon} ${s.fullName}</h2>
      <span class="badge ${badgeClass}">${badgeText}</span>
    </div>
    <div class="stat-row">
      <span class="stat-label">Instructions</span>
      <span class="stat-value" style="color:${barColor(s.instr) === 'green' ? '#00f593' : barColor(s.instr) === 'yellow' ? '#f5a623' : '#ff4060'}">${s.instr}%</span>
    </div>
    <div class="bar-track">
      <div class="bar-fill ${barColor(s.instr)}" style="width:${s.instr}%"></div>
    </div>
    <div class="stat-row">
      <span class="stat-label">Branches</span>
      <span class="stat-value" style="color:${barColor(s.branch) === 'green' ? '#00f593' : barColor(s.branch) === 'yellow' ? '#f5a623' : '#ff4060'}">${s.branch}%</span>
    </div>
    <div class="bar-track">
      <div class="bar-fill ${barColor(s.branch)}" style="width:${s.branch}%"></div>
    </div>
    <div class="stat-row">
      <span class="stat-label">Lines</span>
      <span class="stat-value" style="color:${barColor(s.line) === 'green' ? '#00f593' : barColor(s.line) === 'yellow' ? '#f5a623' : '#ff4060'}">${s.line}%</span>
    </div>
    <div class="bar-track">
      <div class="bar-fill ${barColor(s.line)}" style="width:${s.line}%"></div>
    </div>
    <div class="card-footer">
      <span class="total-stats">${fmt(s.totalLine)} lines · ${fmt(s.totalBranch)} branches · ${fmt(s.totalInstr)} instr</span>
      <a href="${s.reportPath}" target="_blank">Ver reporte →</a>
    </div>
  `;
  grid.appendChild(card);
});

// Summary
const avgInstr = services.reduce((a, s) => a + s.instr, 0) / services.length;
const avgBranch = services.reduce((a, s) => a + s.branch, 0) / services.length;
const avgLine = services.reduce((a, s) => a + s.line, 0) / services.length;

document.getElementById('avgInstr').textContent  = avgInstr.toFixed(0);
document.getElementById('avgBranch').textContent = avgBranch.toFixed(0);
document.getElementById('avgLine').textContent   = avgLine.toFixed(0);

document.getElementById('meta').innerHTML =
  `<strong>${services.length}</strong> microservicios monitoreados · ` +
  `<strong>${pass80}</strong> alcanzan el 80% · ` +
  `<strong>${services.length - pass80}</strong> por debajo de la meta<br>` +
  `<span style="font-size:0.8rem">Cada tarjeta enlaza al reporte detallado de JaCoCo. Los datos se actualizan con cada ejecución de pruebas.</span>`;
</script>
</body>
</html>
