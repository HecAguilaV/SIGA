# ═══════════════════════════════════════════════════════════════════════════
# SIGA - Configuration File
# Schema: Spec-Driven Development (SDD) + Test-Driven Development (TDD)
# ═══════════════════════════════════════════════════════════════════════════

schema: spec-driven-tdd-security

# ─────────────────────────────────────────────────────────────────────────────
# CONTEXTO GLOBAL DEL PROYECTO
# ─────────────────────────────────────────────────────────────────────────────
context: |
  Tech stack: Kotlin (Spring Boot), SvelteKit, React, Android.
  Architecture: Microservices (Eureka-based), Clean Architecture.
  Testing: JUnit 5, Kotest, MockK, Vitest.
  Security: OWASP-aligned, JWT RS256, dependency scanning.

# ─────────────────────────────────────────────────────────────────────────────
# MODO ESTRICTO TDD
# ─────────────────────────────────────────────────────────────────────────────
# Si strict_tdd: true → No se puede hacer commit sin tests passing
strict_tdd: true

# Cobertura mínima obligatoria (%)
minimum_coverage:
  kotlin: 80
  svelte: 70
  react: 70

# ─────────────────────────────────────────────────────────────────────────────
# CONFIGURACIÓN DE TESTING POR STACK
# ─────────────────────────────────────────────────────────────────────────────
testing:
  kotlin:
    framework: kotest
    assertions: kotest-assertions
    mocking: mockk
    integration: testcontainers
    coverage: jacoco
    ci_command: ./gradlew test
    ci_coverage: ./gradlew jacocoTestReport

  svelte:
    framework: vitest
    ui: testing-library
    coverage: v8
    ci_command: npx vitest run
    ci_coverage: npx vitest run --coverage

  react:
    framework: vitest
    ui: testing-library
    coverage: v8
    ci_command: npx vitest run
    ci_coverage: npx vitest run --coverage

  android:
    framework: junit
    ui: espresso
    coverage: jacoco

# ─────────────────────────────────────────────────────────────────────────────
# CONFIGURACIÓN DE SEGURIDAD
# ─────────────────────────────────────────────────────────────────────────────
security:
  enabled: true

  # Escaneo de secretos en código
  secret_scanning:
    enabled: true
    tool: gitleaks
    ci_action: fail  # fail | warn

  # Verificación de dependencias vulnerables
  dependency_check:
    enabled: true
    tool: trivy
    ci_action: fail
    severity_threshold: HIGH  # LOW | MEDIUM | HIGH | CRITICAL

  # SAST (Static Application Security Testing)
  sast:
    enabled: true
    tools:
      - semgrep
    rulesets:
      - owasp-top-ten
      - kotlin-security
      - react-security
    ci_action: warn  # fail | warn

  # Análisis de contenedores
  container_scanning:
    enabled: true
    tool: trivy
    ci_action: warn

  # OWASP Top 10 mitigations
  owasp_mitigations:
    # A01 - Broken Access Control
    - name: access_control_tests
      required: true
    # A02 - Cryptographic Failures
    - name: jwt_validation_tests
      required: true
    - name: password_hashing_tests
      required: true
    # A03 - Injection
    - name: input_validation_tests
      required: true
    # A04 - Insecure Design
    - name: rate_limiting_tests
      required: false
    # A05 - Security Misconfiguration
    - name: config_security_tests
      required: true
    # A06 - Vulnerable Components
    - name: dependency_vulnerability_tests
      required: true
    # A07 - Auth Failures
    - name: auth_failure_tests
      required: true
    # A08 - Data Integrity Failures
    - name: integrity_validation_tests
      required: false
    # A09 - Logging Failures
    - name: audit_log_tests
      required: true
    # A10 - SSRF
    - name: url_validation_tests
      required: false

# ─────────────────────────────────────────────────────────────────────────────
# REGLAS GENERALES POR FASE SDD
# ─────────────────────────────────────────────────────────────────────────────
rules:
  # Reglas para propuestas (proposal)
  proposal:
    - Incluir plan de rollback para cambios riesgosos
    - Identificar módulos/paquetes afectados
    - Identificar vectores de ataque relacionados (security_impact)
    - Incluir análisis OWASP para features de auth/data

  # Reglas para especificaciones (specs)
  specs:
    - Usar formato Given/When/Then para escenarios
    - Usar palabras clave RFC 2119 (DEBE, DEBERÍA, PODRÍA)
    - Incluir "security_requirements" en cada spec
    - Documentar edge cases de seguridad (SQL injection, XSS, etc.)

  # Reglas para diseño técnico (design)
  design:
    - Incluir diagramas de secuencia para flujos complejos
    - Documentar decisiones de arquitectura con justificación
    - Incluir "threat_model" para flujos que manejen datos sensibles
    - Documentar JWKS, rotation de keys, etc.

  # Reglas para tareas de implementación (tasks)
  tasks:
    - Agrupar tareas por fase (infraestructura, implementación, pruebas)
    - Agrupar tareas de seguridad con prefijo [SEC]
    - Mantener tareas lo suficientemente pequeñas para completar en una sesión
    - Cada tarea de seguridad debe incluir test de verificación

  # Reglas para implementación (apply)
  apply:
    - Seguir los patrones y convenciones de código existentes (Arquitectura Hexagonal).
    - [SEC] USAR UUID para todas las claves primarias y foráneas (Ley 21.719).
    - Implementar Auditoría (@PrePersist/@PreUpdate) en todas las entidades.
    - Mantener consistencia bilingüe en referencias de usuario (commercialUserId).

  # Reglas para verificación (verify)
  verify:
    - Verificar cobertura de tests
    - Verificar que existen tests de seguridad para la feature
    - Verificar que SAST pasa sin errores críticos
    - Generar report de cobertura (jacoco/s cobertura)

# ─────────────────────────────────────────────────────────────────────────────
# ESTRUCTURA DE DIRECTORIOS DE TESTS
# ─────────────────────────────────────────────────────────────────────────────
test_structure:
  kotlin:
    root: src/test/kotlin/com/siga
    layers:
      - service/       # Unit tests de servicios
      - controller/    # Tests de controllers (con MockMvc)
      - repository/    # Tests de repositories (con H2/Testcontainers)
      - integration/   # Tests de integración entre servicios
      - security/      # Tests de seguridad específicos

  svelte:
    root: src
    pattern: "**/*.test.{js,ts,svelte}"

  react:
    root: src
    pattern: "**/*.test.{js,ts,tsx}"

# ─────────────────────────────────────────────────────────────────────────────
# CONVENCIONES DE NOMENCLATURA
# ─────────────────────────────────────────────────────────────────────────────
naming:
  test_class:
    kotlin: "{ClassName}Test"  # JwtServiceTest
    svelte: "{ComponentName}.test"  # UserForm.test.ts
    react: "{ComponentName}.test"  # UserForm.test.tsx

  test_method:
    kotlin: "given_{context}_when_{action}_then_{result}"
    pattern: "given_{context}_when_{action}_then_{result}"
    example: "given_valid_token_when_validating_then_should_return_claims"

  security_test:
    pattern: "security_{threat}_should_be_{protection}"
    example: "security_sql_injection_should_be_prevented"
    example: "security_xss_in_user_input_should_be_sanitized"

# ─────────────────────────────────────────────────────────────────────────────
# GITHUB ACTIONS INTEGRATION
# ─────────────────────────────────────────────────────────────────────────────
ci:
  enabled: true
  workflows_path: .github/workflows

  stages:
    - name: test
      command: ./gradlew test
      coverage_check: true

    - name: security
      commands:
        - gitleaks detect --source . --fail-on-warn
        - trivy fs --severity HIGH,CRITICAL .
        - semgrep --config=owasp-top-ten --config=kotlin-security .

    - name: coverage
      command: ./gradlew jacocoTestReport
      min_coverage: 80

  fail_policy:
    tests: strict  # strict | lenient
    security: strict
    coverage: strict

# ─────────────────────────────────────────────────────────────────────────────
# NOTIFICACIONES Y REPORTES
# ─────────────────────────────────────────────────────────────────────────────
reporting:
  coverage_report:
    format: html,xml
    output: build/reports/jacoco

  security_report:
    format: json,html
    output: build/reports/security

  pr_checks:
    - test_results
    - coverage
    - security_scan