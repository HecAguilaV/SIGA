# =============================================================================
# CONFIGMAP - billing-config
# Servicio: Billing Service (Facturación y Pagos)
# =============================================================================
# Propósito: Proveer configuración al servicio de facturación.
# Procesa pagos, genera facturas, maneja reembolsos y reportes financieros.
# =============================================================================
apiVersion: v1
kind: ConfigMap
metadata:
  name: billing-config
  namespace: siga
  labels:
    app: siga-billing
    project: siga
data:
  SPRING_PROFILES_ACTIVE: "eks"

  # ---------------------------------------------------------------------------
  # Base de datos PostgreSQL (RDS)
  # ---------------------------------------------------------------------------
  DB_HOST: "siga-production-postgres.cm75k1vmfnks.us-east-1.rds.amazonaws.com"
  DB_PORT: "5432"
  DB_NAME: "siga_billing"
  DB_SCHEMA: "billing"
  DB_SSL_MODE: "require"

  # ---------------------------------------------------------------------------
  # Configuración de datasource JDBC
  # ---------------------------------------------------------------------------
  SPRING_DATASOURCE_URL: "jdbc:postgresql://siga-production-postgres.cm75k1vmfnks.us-east-1.rds.amazonaws.com:5432/siga_billing?sslmode=require"
  SPRING_JPA_HIBERNATE_DDL_AUTO: "update"

  # ---------------------------------------------------------------------------
  # Configuración de Kafka - broker de mensajería
  # ---------------------------------------------------------------------------
  KAFKA_BOOTSTRAP_SERVERS: "siga-kafka.siga.svc.cluster.local:9092"
  MANAGEMENT_HEALTH_KAFKA_ENABLED: "false"
  SPRING_AUTOCONFIGURE_EXCLUDE: "org.springframework.boot.autoconfigure.kafka.KafkaAutoConfiguration"

  # ---------------------------------------------------------------------------
  # URLs de servicios vecinos
  # ---------------------------------------------------------------------------
  AUTH_SERVICE_URL: "http://siga-auth.siga.svc.cluster.local:8081"
  SALES_SERVICE_URL: "http://siga-sales.siga.svc.cluster.local:8083"
  NOTIFICATION_SERVICE_URL: "http://siga-notification.siga.svc.cluster.local:8085"
  EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: "http://siga-registry.siga.svc.cluster.local:8761/eureka/"
  EUREKA_URL: "http://siga-registry.siga.svc.cluster.local:8761/eureka"
  REGISTRY_SERVICE_URL: "http://siga-registry.siga.svc.cluster.local:8761/eureka"

  # ---------------------------------------------------------------------------
  # Configuración específica de facturación
  # ---------------------------------------------------------------------------
  # Impuesto por defecto (IVA) en porcentaje
  BILLING_DEFAULT_TAX_RATE: "21.0"
  # Moneda por defecto (ISO 4217)
  BILLING_DEFAULT_CURRENCY: "ARS"
  # Formato de factura
  BILLING_INVOICE_FORMAT: "PDF"
