# =============================================================================
# CONFIGMAP: Kafka Configuration
# SECCIÓN: ConfigMap para configuración de Apache Kafka (KRaft mode)
# =============================================================================
# Rationale / Decisión: KRaft mode eliminates ZooKeeper dependency (KIP-853).
# Single broker for lab. In production, use 3+ brokers with replication.
#
# Propósito: Configuración base del broker Kafka en modo KRaft.
# =============================================================================
apiVersion: v1
kind: ConfigMap
metadata:
  name: siga-kafka-config
  namespace: siga
  labels:
    app: siga-kafka
    project: siga
data:
  KAFKA_NODE_ID: "1"
  KAFKA_PROCESS_ROLES: "broker,controller"
  KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: "CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT"
  KAFKA_ADVERTISED_LISTENERS: "PLAINTEXT://siga-kafka.siga.svc.cluster.local:29092,PLAINTEXT_HOST://localhost:9092"
  KAFKA_LISTENERS: "PLAINTEXT://0.0.0.0:29092,CONTROLLER://0.0.0.0:29093,PLAINTEXT_HOST://0.0.0.0:9092"
  KAFKA_INTER_BROKER_LISTENER_NAME: "PLAINTEXT"
  KAFKA_CONTROLLER_LISTENER_NAMES: "CONTROLLER"
  KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: "1"
  KAFKA_CONTROLLER_QUORUM_VOTERS: "1@siga-kafka.siga.svc.cluster.local:29093"
  KAFKA_LOG_DIRS: "/var/lib/kafka/data"
  KAFKA_JMX_PORT: "9101"
  KAFKA_JMX_HOSTNAME: "localhost"
  CLUSTER_ID: "MkU3OEVBNTcwNTJDRkFCMz"
