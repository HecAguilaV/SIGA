# =============================================================================
# DEPLOYMENT: Apache Kafka (KRaft mode)
# SECCIÓN: Kafka Deployment con almacenamiento efímero (emptyDir)
# =============================================================================
# Rationale / Decisión: Kafka en KRaft mode (sin ZooKeeper, KIP-853).
# Single broker para laboratorio académico.
#
# Cambio de StatefulSet a Deployment:
#   El lab de AWS Academy no permite instalar el EBS CSI driver add-on
#   (requiere IAM OIDC provider, bloqueado por permisos del lab).
#   Sin EBS CSI driver, no se pueden crear volúmenes persistentes (PVC).
#   Solución: usar emptyDir (almacenamiento efímero en el nodo).
#   Los datos se pierden al reiniciar el pod, pero para un lab es suficiente.
#
# Purpose / Propósito: Message broker para transacciones distribuidas
# (SAGA Coreografía) entre microservicios SIGA.
# =============================================================================
apiVersion: apps/v1
kind: Deployment
metadata:
  name: siga-kafka
  namespace: siga
  labels:
    app: siga-kafka
    component: messaging
    project: siga
spec:
  replicas: 1
  selector:
    matchLabels:
      app: siga-kafka
  template:
    metadata:
      labels:
        app: siga-kafka
        component: messaging
    spec:
      securityContext:
        fsGroup: 1000
      containers:
        - name: kafka
          image: confluentinc/cp-kafka:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 9092
              name: client
              protocol: TCP
            - containerPort: 29093
              name: controller
              protocol: TCP
          env:
            - name: KAFKA_NODE_ID
              value: "1"
            - name: KAFKA_PROCESS_ROLES
              value: "broker,controller"
            - name: KAFKA_LISTENERS
              value: "PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:29093"
            - name: KAFKA_ADVERTISED_LISTENERS
              value: "PLAINTEXT://siga-kafka.siga.svc.cluster.local:9092"
            - name: KAFKA_CONTROLLER_LISTENER_NAMES
              value: "CONTROLLER"
            - name: KAFKA_LISTENER_SECURITY_PROTOCOL_MAP
              value: "CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT"
            - name: KAFKA_CONTROLLER_QUORUM_VOTERS
              value: "1@siga-kafka.siga.svc.cluster.local:29093"
            - name: KAFKA_INTER_BROKER_LISTENER_NAME
              value: "PLAINTEXT"
            - name: KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR
              value: "1"
            - name: KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR
              value: "1"
            - name: KAFKA_TRANSACTION_STATE_LOG_MIN_ISR
              value: "1"
            - name: KAFKA_LOG_DIRS
              value: "/tmp/kraft-combined-logs"
            - name: CLUSTER_ID
              value: "MkU3OEVBNTcwNTJENDM2Qk"
          resources:
            requests:
              memory: "512Mi"
              cpu: "250m"
            limits:
              memory: "1Gi"
              cpu: "500m"
          volumeMounts:
            - name: kafka-data
              mountPath: /tmp/kraft-combined-logs
          securityContext:
            runAsUser: 1000
            runAsGroup: 1000
      volumes:
        - name: kafka-data
          emptyDir:
            sizeLimit: 5Gi
