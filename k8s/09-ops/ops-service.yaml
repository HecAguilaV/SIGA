# =============================================================================
# SERVICE - siga-ops (God Admin Panel)
# =============================================================================
# Expone el God Admin Panel + Swagger proxy via Classic ELB.
# =============================================================================
apiVersion: v1
kind: Service
metadata:
  name: siga-ops
  namespace: siga
  labels:
    app: siga-ops
    project: siga
    tier: ops
  annotations:
    service.beta.kubernetes.io/aws-load-balancer-type: "clb"
    service.beta.kubernetes.io/aws-load-balancer-internal: "false"
spec:
  selector:
    app: siga-ops
  ports:
    - protocol: TCP
      port: 80
      targetPort: 80
      name: http
  type: LoadBalancer
