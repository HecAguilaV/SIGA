# =============================================================================
# DEPLOYMENT - siga-notification
# Servicio: Notification Service (Notificaciones)
# =============================================================================
# Propósito: Envía notificaciones por email, SMS y push notifications.
# Consume eventos de Kafka (orden creada, pago confirmado, stock bajo)
# y los transforma en notificaciones a los usuarios.
#
# Replicas: 2 - Las notificaciones son asíncronas pero no deben perderse.
#   Kafka consumer groups permiten que múltiples instancias consuman
#   particiones en paralelo.
#
# Recursos:
#   Request: 256Mi/250m
#   Limit:   512Mi/500m
# =============================================================================
apiVersion: apps/v1
kind: Deployment
metadata:
  name: siga-notification
  namespace: siga
  labels:
    app: siga-notification
    project: siga
    tier: backend
spec:
  replicas: 1
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: siga-notification
  template:
    metadata:
      labels:
        app: siga-notification
        project: siga
        tier: backend
    spec:
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchExpressions:
                    - key: app
                      operator: In
                      values:
                        - siga-notification
                topologyKey: "kubernetes.io/hostname"
      containers:
        - name: notification
          image: 162272997857.dkr.ecr.us-east-1.amazonaws.com/siga-production/notification:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 8086
              protocol: TCP
              name: http
          resources:
            requests:
              memory: "512Mi"
              cpu: "250m"
            limits:
              memory: "1Gi"
              cpu: "1"
          readinessProbe:
            tcpSocket:
              port: 8086
            initialDelaySeconds: 15
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          livenessProbe:
            tcpSocket:
              port: 8086
            initialDelaySeconds: 30
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 3
          envFrom:
            - configMapRef:
                name: notification-config
          env:
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: db-secret
                  key: DB_PASSWORD
                  optional: false
            - name: SMTP_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: db-secret
                  key: SMTP_PASSWORD
                  optional: false
            - name: NOTIFICATION_DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: db-secret
                  key: DB_PASSWORD
                  optional: false
          volumeMounts:
            - name: config-volume
              mountPath: /etc/config
              readOnly: true
      volumes:
        - name: config-volume
          configMap:
            name: notification-config
