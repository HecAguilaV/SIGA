# =============================================================================
# DEPLOYMENT - siga-inventory
# Servicio: Inventory Service (Gestión de Inventario)
# =============================================================================
# Propósito: Catálogo de activos, control de stock, categorías,
# movimientos de inventario y consultas de disponibilidad.
#
# Replicas: 2 - Servicio de consulta frecuente, necesita HA.
#
# Recursos:
#   Request: 256Mi/250m - Operación normal con caché Redis
#   Limit:   512Mi/500m - Pico con importaciones masivas
# =============================================================================
apiVersion: apps/v1
kind: Deployment
metadata:
  name: siga-inventory
  namespace: siga
  labels:
    app: siga-inventory
    project: siga
    tier: backend
spec:
  replicas: 1
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: siga-inventory
  template:
    metadata:
      labels:
        app: siga-inventory
        project: siga
        tier: backend
    spec:
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchExpressions:
                    - key: app
                      operator: In
                      values:
                        - siga-inventory
                topologyKey: "kubernetes.io/hostname"
      containers:
        - name: inventory
          image: 117494389645.dkr.ecr.us-east-1.amazonaws.com/siga-production/inventory:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 8082
              protocol: TCP
              name: http
          resources:
            requests:
              memory: "512Mi"
              cpu: "250m"
            limits:
              memory: "1Gi"
              cpu: "1"
          readinessProbe:
            tcpSocket:
              port: 8082
            initialDelaySeconds: 15
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          livenessProbe:
            tcpSocket:
              port: 8082
            initialDelaySeconds: 30
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 3
          envFrom:
            - configMapRef:
                name: inventory-config
          env:
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: db-secret
                  key: DB_PASSWORD
                  optional: false
            - name: INVENTORY_DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: db-secret
                  key: DB_PASSWORD
                  optional: false
          volumeMounts:
            - name: config-volume
              mountPath: /etc/config
              readOnly: true
      volumes:
        - name: config-volume
          configMap:
            name: inventory-config
