# =============================================================================
# SECRET - db-secret (PLACEHOLDER - NO CONTIENE SECRETS REALES)
# =============================================================================
# ADVERTENCIA: Este archivo es solo un PLACEHOLDER documental.
# Los secrets reales NO SE VERSIONAN en el repositorio.
#
# Decisión de seguridad:
#   Los secrets se inyectan desde AWS Secrets Manager usando el
#   Secrets Store CSI Driver. Esto asegura que:
#     1. Los secrets nunca quedan en el repositorio git
#     2. Rotación centralizada desde AWS Secrets Manager
#     3. Auditoría de acceso a través de CloudTrail
#     4. Políticas IAM granulares por servicio
#
# Instrucciones para crear los secrets manualmente (solo para desarrollo local):
#
#   kubectl create secret generic db-secret \
#     --namespace=siga \
#     --from-literal=DB_PASSWORD='<password>' \
#     --from-literal=JWT_SECRET='<jwt-secret>' \
#     --from-literal=REDIS_PASSWORD='<redis-password>' \
#     --from-literal=SMTP_PASSWORD='<smtp-password>' \
#     --from-literal=AI_API_KEY='<api-key>'
#
# En producción, usar AWS Secrets Manager + CSI Driver:
#
#   apiVersion: secrets-store.csi.x-k8s.io/v1
#   kind: SecretProviderClass
#   metadata:
#     name: siga-aws-secrets
#     namespace: siga
#   spec:
#     provider: aws
#     parameters:
#       objects: |
#         - objectName: "siga/db-password"
#           objectType: "secretsmanager"
#         - objectName: "siga/jwt-secret"
#           objectType: "secretsmanager"
# =============================================================================
apiVersion: v1
kind: Secret
metadata:
  name: db-secret
  namespace: siga
  labels:
    project: siga
    managed-by: placeholder
  annotations:
    note: "REEMPLAZAR con Secrets Store CSI Driver o kubectl create secret"
type: Opaque
data:
  # Los valores están VACÍOS. Ejecutar el comando de arriba para poblarlos.
  DB_PASSWORD: ""
  JWT_SECRET: ""
  REDIS_PASSWORD: ""
  SMTP_PASSWORD: ""
  AI_API_KEY: ""
