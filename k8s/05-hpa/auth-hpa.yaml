# =============================================================================
# HPA - auth-hpa
# Servicio: Auth Service
# =============================================================================
# Propósito: Escalado automático del servicio de autenticación.
# El auth service valida tokens en cada request, es crítico escalarlo.
# =============================================================================
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: siga-auth-hpa
  namespace: siga
  labels:
    app: siga-auth
    project: siga
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: siga-auth
  minReplicas: 1
  maxReplicas: 5
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 80
