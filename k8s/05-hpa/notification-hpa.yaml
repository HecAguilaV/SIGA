# =============================================================================
# HPA - notification-hpa
# Servicio: Notification Service
# =============================================================================
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: siga-notification-hpa
  namespace: siga
  labels:
    app: siga-notification
    project: siga
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: siga-notification
  minReplicas: 1
  maxReplicas: 5
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 80
