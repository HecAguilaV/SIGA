# =============================================================================
# HPA - dashboard-hpa
# Servicio: Dashboard (Frontend SvelteKit)
# =============================================================================
# Propósito: Escalado automático del frontend SvelteKit.
# SSR puede ser CPU intensivo bajo carga. El HPA asegura que
# haya suficientes réplicas para servir páginas sin latencia.
# =============================================================================
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: siga-dashboard-hpa
  namespace: siga
  labels:
    app: siga-dashboard
    project: siga
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: siga-dashboard
  minReplicas: 1
  maxReplicas: 5
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 80
