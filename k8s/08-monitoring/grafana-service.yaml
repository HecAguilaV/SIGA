# =============================================================================
# SERVICE: Grafana
# SECCIÓN: Exposición de Grafana para acceso durante la demo
# =============================================================================
# Rationale / Decisión: ClusterIP + port-forward para la demo.
# No se crea un ALB adicional para ahorrar costos ($50 presupuesto).
#
# Acceso durante demo:
#   kubectl port-forward -n siga svc/grafana 3001:3000
#   → http://localhost:3001 (user: admin, pass: admin)
#
# Para exponer via ALB en el futuro:
#   1. Cambiar service type a LoadBalancer
#   2. O agregar regla en alb-ingress.yaml con hostname
# =============================================================================
apiVersion: v1
kind: Service
metadata:
  name: grafana
  namespace: siga
  labels:
    app: grafana
    component: monitoring
    project: siga
spec:
  selector:
    app: grafana
  ports:
    - name: http
      protocol: TCP
      port: 3000
      targetPort: 3000
  type: ClusterIP
