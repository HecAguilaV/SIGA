# =============================================================================
# DEPLOYMENT: Prometheus
# SECCIÓN: Servicio de recolección de métricas
# =============================================================================
# Rationale / Decisión: Prometheus recolecta métricas de todos los pods
# automáticamente via Kubernetes SD. Sin persistencia para ahorrar costos
# (en producción usar StatefulSet con PV).
#
# Purpose / Propósito: Recolectar métricas de CPU, RAM, HTTP requests,
# errores y latencia de todos los microservicios SIGA.
#
# Evaluación DevOps IE3 (15%): Dashboard de monitoreo en tiempo real.
# =============================================================================
apiVersion: apps/v1
kind: Deployment
metadata:
  name: prometheus
  namespace: siga
  labels:
    app: prometheus
    component: monitoring
    project: siga
spec:
  replicas: 1
  selector:
    matchLabels:
      app: prometheus
  template:
    metadata:
      labels:
        app: prometheus
        component: monitoring
    spec:
      serviceAccountName: prometheus
      containers:
        - name: prometheus
          image: prom/prometheus:v2.54.0
          imagePullPolicy: IfNotPresent
          args:
            - "--config.file=/etc/prometheus/prometheus.yml"
            - "--storage.tsdb.path=/prometheus"
            - "--storage.tsdb.retention.time=7d"
            - "--web.console.libraries=/usr/share/prometheus/console_libraries"
            - "--web.console.templates=/usr/share/prometheus/consoles"
          ports:
            - containerPort: 9090
              name: http
              protocol: TCP
          resources:
            requests:
              memory: "256Mi"
              cpu: "100m"
            limits:
              memory: "512Mi"
              cpu: "250m"
          volumeMounts:
            - name: config
              mountPath: /etc/prometheus
            - name: data
              mountPath: /prometheus
      volumes:
        - name: config
          configMap:
            name: prometheus-config
        - name: data
          emptyDir: {}
          # Decisión: emptyDir para laboratorio. Los datos se pierden
          # al reiniciar el pod. En producción usar PersistentVolumeClaim.
