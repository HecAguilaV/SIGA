# =============================================================================
# DEPLOYMENT: Grafana
# SECCIÓN: Dashboard de monitoreo y visualización
# =============================================================================
# Rationale / Decisión: Grafana se conecta a Prometheus para mostrar
# dashboards de métricas en tiempo real. Incluye dashboards pre-cargados
# para Kubernetes y Spring Boot.
#
# Purpose / Propósito: Visualización de métricas para la evaluación
# DevOps IE3 (Métricas y Monitoreo).
#
# Acceso durante demo:
#   kubectl port-forward -n siga svc/grafana 3001:3000
#   → http://localhost:3001 (admin/admin)
# =============================================================================
apiVersion: apps/v1
kind: Deployment
metadata:
  name: grafana
  namespace: siga
  labels:
    app: grafana
    component: monitoring
    project: siga
spec:
  replicas: 1
  selector:
    matchLabels:
      app: grafana
  template:
    metadata:
      labels:
        app: grafana
        component: monitoring
    spec:
      containers:
        - name: grafana
          image: grafana/grafana:11.1.0
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 3000
              name: http
              protocol: TCP
          env:
            - name: GF_SECURITY_ADMIN_USER
              value: "admin"
            - name: GF_SECURITY_ADMIN_PASSWORD
              value: "admin"
            - name: GF_INSTALL_PLUGINS
              value: "" # Sin plugins extra para mantener imagen liviana
          resources:
            requests:
              memory: "128Mi"
              cpu: "50m"
            limits:
              memory: "256Mi"
              cpu: "150m"
          volumeMounts:
            - name: datasources
              mountPath: /etc/grafana/provisioning/datasources
              readOnly: true
      volumes:
        - name: datasources
          configMap:
            name: grafana-datasources
