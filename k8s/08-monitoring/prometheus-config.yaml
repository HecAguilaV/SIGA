# =============================================================================
# CONFIGMAP: Prometheus Configuration
# SECCIÓN: Configuración de recolección de métricas
# =============================================================================
# Rationale / Decisión: Kubernetes SD config permite a Prometheus descubrir
# automáticamente TODOS los pods del namespace siga sin configuración manual.
#
# Targets / Objetivos:
#   - kubelet/cadvisor: Métricas de contenedores (CPU, RAM, disco)
#   - Pod metrics (actuator): Métricas de Spring Boot y aplicación
#
# Evaluación DevOps IE3: Dashboards de monitoreo en tiempo real.
# =============================================================================
apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-config
  namespace: siga
  labels:
    app: prometheus
    component: monitoring
    project: siga
data:
  prometheus.yml: |
    # =====================================================================
    # PROMETHEUS CONFIG - SIGA Microservices
    # =====================================================================
    global:
      scrape_interval: 15s
      evaluation_interval: 15s

    scrape_configs:
      # ---------------------------------------------------------------
      # Kubernetes Nodes (cAdvisor) - CPU/RAM/Network por contenedor
      # Expone métricas de todos los contenedores en el nodo
      # ---------------------------------------------------------------
      - job_name: 'kubernetes-nodes'
        scheme: https
        tls_config:
          ca_file: /var/run/secrets/kubernetes.io/serviceaccount/ca.crt
          insecure_skip_verify: true
        bearer_token_file: /var/run/secrets/kubernetes.io/serviceaccount/token
        kubernetes_sd_configs:
          - role: node
        relabel_configs:
          - target_label: __address__
            replacement: kubernetes.default.svc:443
          - source_labels: [__meta_kubernetes_node_name]
            regex: (.+)
            target_label: __metrics_path__
            replacement: /api/v1/nodes/${1}/proxy/metrics/cadvisor

      # ---------------------------------------------------------------
      # Kubernetes Pods - Métricas de aplicación (Spring Boot Actuator)
      # Descubre automáticamente pods con annotation prometheus.io/scrape=true
      # ---------------------------------------------------------------
      - job_name: 'kubernetes-pods'
        kubernetes_sd_configs:
          - role: pod
        relabel_configs:
          - source_labels: [__meta_kubernetes_pod_annotation_prometheus_io_scrape]
            action: keep
            regex: true
          - source_labels: [__meta_kubernetes_pod_annotation_prometheus_io_path]
            action: replace
            target_label: __metrics_path__
            regex: (.+)
          - source_labels: [__address__, __meta_kubernetes_pod_annotation_prometheus_io_port]
            action: replace
            regex: ([^:]+)(?::\d+)?;(\d+)
            replacement: $1:$2
            target_label: __address__
          - source_labels: [__meta_kubernetes_pod_annotation_prometheus_io_scheme]
            action: replace
            regex: (.+)
            target_label: __scheme__
          - action: labelmap
            regex: __meta_kubernetes_pod_label_(.+)
          - source_labels: [__meta_kubernetes_namespace]
            action: replace
            target_label: kubernetes_namespace
          - source_labels: [__meta_kubernetes_pod_name]
            action: replace
            target_label: kubernetes_pod_name

      # ---------------------------------------------------------------
      # Kubernetes Services - Endpoints de servicios
      # ---------------------------------------------------------------
      - job_name: 'kubernetes-services'
        kubernetes_sd_configs:
          - role: endpoints
        relabel_configs:
          - source_labels: [__meta_kubernetes_namespace]
            action: keep
            regex: siga
