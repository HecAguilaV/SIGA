# SIGA Auth - Production SMTP Configuration
# SPRING_MAIL_* env vars are auto-mapped by Spring Boot.
# Activate with: --spring.profiles.active=prod
spring:
  mail:
    host: ${SPRING_MAIL_HOST:}
    port: ${SPRING_MAIL_PORT:587}
    username: ${SPRING_MAIL_USERNAME:}
    password: ${SPRING_MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
