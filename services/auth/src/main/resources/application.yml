server:
  port: 8081

spring:
  application:
    name: siga-auth
  datasource:
    url: jdbc:postgresql://${DB_HOST:-localhost}:5432/${AUTH_DB_NAME:-siga_db}
    username: ${AUTH_DB_USER:-admin}
    password: ${AUTH_DB_PASSWORD:-password123}
  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        default_schema: siga_saas # Default a saas, aunque el modulo accede a ambos

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_URL:-http://localhost:8761/eureka/}

jwt:
  secret: ${JWT_SECRET:-super-secret-key-too-long-to-be-secure-enough-probably-123456}
