server:
  port: 8081

spring:
  application:
    name: siga-auth
  datasource:
    url: jdbc:postgresql://${DB_HOST:-siga-db}:5432/siga_auth
    username: ${AUTH_DB_USER:-auth_user}
    password: ${AUTH_DB_PASSWORD:-auth_pass_2026}
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    baseline-version: 0
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        default_schema: auth

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_URL:-http://localhost:8761/eureka/}

jwt:
  secret: ${JWT_SECRET:-super-secret-key-too-long-to-be-secure-enough-probably-123456}
