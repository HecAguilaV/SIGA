server:
  port: 8086

spring:
  application:
    name: siga-notification
  datasource:
    url: jdbc:postgresql://${DB_HOST:-siga-db}:5432/siga_notification
    username: ${NOTIFICATION_DB_USER:-notification_user}
    password: ${NOTIFICATION_DB_PASSWORD}
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    baseline-version: 0
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        default_schema: notification

  # Kafka — consumer for email-events topic
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:-localhost:9092}
    consumer:
      group-id: siga-notification
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      properties:
        spring.json.trusted.packages: com.siga.notification.domain

  # Mail — uses JavaMailSender. SMTP configured in application-prod.yml (prod profile).
  # In dev, mail sender logs instead of sending.
  mail:
    host: ${SPRING_MAIL_HOST:}
    port: ${SPRING_MAIL_PORT:587}

eureka:
  instance:
    hostname: siga-notification
  client:
    service-url:
      defaultZone: ${EUREKA_URL:-http://localhost:8761/eureka/}
