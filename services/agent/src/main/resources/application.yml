server:
  port: 8000

spring:
  application:
    name: siga-agent
  datasource:
    url: jdbc:postgresql://localhost:5432/siga_agent
    username: agent_user
    password: agent_pass
    hikari:
      initialization-fail-timeout: -1

management:
  health:
    db:
      enabled: false

eureka:
  instance:
    hostname: siga-agent
  client:
    service-url:
      defaultZone: ${EUREKA_CLIENT_SERVICEURL_DEFAULTZONE:http://localhost:8761/eureka/}

gemini:
  api-key: ${GEMINI_API_KEY:}
  model-id: ${GEMINI_MODEL_ID:gemini-2.0-flash-001}

logging:
  level:
    com.siga.agent: ${LOG_LEVEL:INFO}
