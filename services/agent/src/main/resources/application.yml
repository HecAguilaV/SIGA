server:
  port: 8000

spring:
  application:
    name: siga-agent

eureka:
  instance:
    hostname: siga-agent
  client:
    service-url:
      defaultZone: ${EUREKA_CLIENT_SERVICEURL_DEFAULTZONE:http://localhost:8761/eureka/}

gemini:
  api-key: ${GEMINI_API_KEY:}
  model-id: ${GEMINI_MODEL_ID:gemini-2.0-flash-001}

logging:
  level:
    com.siga.agent: ${LOG_LEVEL:INFO}
