# Test profile for siga-agent
# Disables external dependencies so @SpringBootTest can start without real services
spring:
  # Use H2 in-memory database for tests (PostgreSQL compatibility mode)
  datasource:
    url: jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
    driver-class-name: org.h2.Driver
    username: sa
    password:
  # Disable Flyway for tests (H2 schema managed by JPA/Hibernate)
  flyway:
    enabled: false
  # Disable Kafka for tests
  kafka:
    bootstrap-servers: localhost:0
    listener:
      auto-startup: false

eureka:
  client:
    enabled: false
  instance:
    enabled: false

gemini:
  api-key: test-key
  model-id: gemini-2.0-flash-001

logging:
  level:
    com.siga.agent: DEBUG
