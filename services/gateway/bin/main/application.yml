server:
  port: 8080

spring:
  application:
    name: siga-gateway
  cloud:
    gateway:
      globalcors:
        corsConfigurations:
          '[/**]':
            allowedOrigins: "*"
            allowedMethods:
              - GET
              - POST
              - PUT
              - DELETE
              - OPTIONS
            allowedHeaders: "*"
      discovery:
        locator:
          enabled: true
          lower-case-service-id: true
      routes:
        # Auth Routes
        - id: siga-auth
          uri: lb://siga-auth
          predicates:
            - Path=/api/auth/**

        # Inventory Routes
        - id: siga-inventory
          uri: lb://siga-inventory
          predicates:
            - Path=/api/products/**
            - Path=/api/stores/**
            - Path=/api/inventory/**

        # Sales Routes
        - id: siga-sales
          uri: lb://siga-sales
          predicates:
            - Path=/api/sales/**
            - Path=/api/cash-shifts/**

        # Billing / Commercial Routes
        - id: siga-billing
          uri: lb://siga-billing
          predicates:
            - Path=/api/billing/**
            - Path=/api/comercial/**

        # AI Agent Routes
        - id: siga-agent
          uri: lb://siga-agent
          predicates:
            - Path=/api/agent/**

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_CLIENT_SERVICEURL_DEFAULTZONE:http://siga-eureka:8761/eureka/}