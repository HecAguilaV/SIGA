server:
  port: 8080

spring:
  application:
    name: siga-gateway
  cloud:
    gateway:
      globalcors:
        corsConfigurations:
          '[/**]':
            allowedOrigins: "*"
            allowedMethods:
              - GET
              - POST
              - PUT
              - DELETE
              - OPTIONS
            allowedHeaders: "*"
      discovery:
        locator:
          enabled: false
          lower-case-service-id: true
      routes:
        # Auth Routes
        - id: siga-auth
          uri: lb://siga-auth
          predicates:
            - Path=/api/auth/**
          filters:
            - RewritePath=/api/auth/(?<segment>.*), /api/v1/auth/$\{segment}

        # Inventory Routes
        - id: siga-inventory
          uri: lb://siga-inventory
          predicates:
            - Path=/api/products/**
            - Path=/api/stores/**
            - Path=/api/inventory/**
          filters:
            - RewritePath=/api/(?<service>products|stores|inventory)/(?<segment>.*), /api/v1/$\{service}/$\{segment}

        # Sales Routes
        - id: siga-sales
          uri: lb://siga-sales
          predicates:
            - Path=/api/sales/**
            - Path=/api/cash-shifts/**
          filters:
            - RewritePath=/api/(?<segment>.*), /api/v1/$\{segment}

        # Billing / Commercial Routes
        - id: siga-billing
          uri: lb://siga-billing
          predicates:
            - Path=/api/billing/**
            - Path=/api/comercial/**
          filters:
            - RewritePath=/api/billing/(?<segment>.*), /api/v1/billing/$\{segment}
            - RewritePath=/api/comercial/(?<segment>.*), /api/v1/billing/$\{segment}

        # AI Agent Routes (no /v1/ prefix needed)
        - id: siga-agent
          uri: lb://siga-agent
          predicates:
            - Path=/api/agent/**

eureka:
  instance:
    hostname: siga-gateway
  client:
    service-url:
      defaultZone: ${EUREKA_CLIENT_SERVICEURL_DEFAULTZONE:http://siga-eureka:8761/eureka/}
