server:
  port: 8083

spring:
  application:
    name: siga-sales
  datasource:
    url: jdbc:postgresql://${DB_HOST:-localhost}:5432/${SALES_DB_NAME:-siga_db}
    username: ${SALES_DB_USER:-admin}
    password: ${SALES_DB_PASSWORD:-password123}
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    baseline-version: 0
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        default_schema: sales

  # Kafka — SAGA choreography with Inventory service
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:-localhost:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      properties:
        spring.json.add.type.headers: false
    consumer:
      group-id: siga-sales
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      properties:
        spring.json.trusted.packages: com.siga.sales.event,com.siga.inventory.event

eureka:
  instance:
    hostname: siga-sales
  client:
    service-url:
      defaultZone: ${EUREKA_URL:-http://localhost:8761/eureka/}

# Security OAuth2 Resource Server for JWT Pass-through
spring.security.oauth2.resourceserver.jwt.issuer-uri: "siga-auth"
