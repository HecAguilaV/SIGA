server:
  port: 8083

spring:
  application:
    name: siga-sales
  datasource:
    url: jdbc:postgresql://${DB_HOST:-localhost}:5432/${SALES_DB_NAME:-siga_db}
    username: ${SALES_DB_USER:-admin}
    password: ${SALES_DB_PASSWORD:-password123}
  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        default_schema: sales

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_URL:-http://localhost:8761/eureka/}

# Security OAuth2 Resource Server for JWT Pass-through
spring.security.oauth2.resourceserver.jwt.issuer-uri: "siga-auth"
