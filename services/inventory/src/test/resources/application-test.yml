spring:
  flyway:
    enabled: false
  datasource:
    url: jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;INIT=CREATE SCHEMA IF NOT EXISTS INVENTORY
    driverClassName: org.h2.Driver
    username: sa
    password:
  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: create-drop
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        default_schema: inventory
        metadata_builder_contributor: com.siga.inventory.config.UnaccentMetadataContributor

  # Redis config for tests (Testcontainers overrides port via @DynamicPropertySource)
  data:
    redis:
      port: 6379

  # Kafka config for tests (pointing to nothing, but beans will be mocked)
  kafka:
    bootstrap-servers: localhost:9092

# Security bypass for integration tests
jwt:
  secret: test-secret-key-that-is-long-enough-for-hs256-algorithm-123456
