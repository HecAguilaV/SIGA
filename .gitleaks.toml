# ═══════════════════════════════════════════════════════════════════════════
# Gitleaks Configuration - SIGA
# Secret scanning rules
# ═══════════════════════════════════════════════════════════════════════════

[allowlist]
  description = "SIGA False Positives"
  paths = [
    # Documentación de evidencias (credenciales censuradas o de ejemplo)
    "docs/evidencia-despliegue\\.md",
    "docs/en/evidencia-despliegue\\.md",
    "docs/es/evidencia-despliegue\\.md",
    # ACADEMIC/ está en .gitignore pero por si acaso
    "ACADEMIC/.*",
    # Archivos de testing con datos dummy
    "(?i).*test.*",
    "(?i).*Test.*\\.kt",
    "(?i).*Tests\\.kt",
    ".*\\.test\\.ts",
    ".*\\.test\\.tsx",
    # Datos de ejemplo y diseño
    "(?i).*datos.*",
    "(?i).*mock.*",
    "(?i).*fixtures.*",
    ".*\\.pgerd",
    ".*\\.svg",
    # Archivos de infraestructura/locks
    "package-lock\\.json",
    "pnpm-lock\\.yaml",
    "\\.gradle/.*",
    "\\.idea/.*",
    # Ruido de herramientas (Antigravity/Postman/Semgrep)
    ".*task\\.md",
    ".*prompt\\.md",
    ".*postman_collection\\.json",
    ".*\\.system_generated/.*",
    "\\.tools/.*",
    # Configs de ejemplo (no son secrets reales)
    ".*\\.example",
    "(?i).*example.*",
    # K8s manifests — contienen endpoints de RDS, SG IDs y otros
    # identificadores de infraestructura que no son secrets
    "k8s/.*",
    # Terraform — identificadores de recursos AWS
    "terraform/.*",
    # Documentación general
    "docs/.*",
    ".*\\.md",
  ]

[[rules]]
  id = "generic-api-key"
  description = "Generic API Key"
  regex = '''(?i)(api[_-]?key|apikey|api[_-]?secret)\s*[:=]\s*["']?[a-zA-Z0-9]{16,}["']?'''
  tags = ["key", "API"]

[[rules]]
  id = "generic-secret"
  description = "Generic Secret"
  regex = '''(?i)(secret|password|passwd|pwd)\s*[:=]\s*["']?[a-zA-Z0-9]{8,}["']?'''
  tags = ["secret", "password"]

[[rules]]
  id = "aws-access-key"
  description = "AWS Access Key"
  regex = '''(A3T[A-Z0-9]|AKIA|AGPA|AIDA|AROA|AIPA|ANPA|ANVA|ASIA)[A-Z0-9]{16}'''
  tags = ["key", "AWS"]

[[rules]]
  id = "aws-secret-key"
  description = "AWS Secret Key"
  regex = '''(?i)aws[_-]?secret[_-]?access[_-]?key\s*[:=]\s*["']?[A-Za-z0-9/+=]{40}["']?'''
  tags = ["key", "AWS"]

[[rules]]
  id = "github-token"
  description = "GitHub Token"
  regex = '''gh[pousr]_[A-Za-z0-9]{36,}'''
  tags = ["key", "GitHub"]

[[rules]]
  id = "gitlab-token"
  description = "GitLab Token"
  regex = '''glpat-[0-9a-zA-Z\-]{20}'''
  tags = ["key", "GitLab"]

[[rules]]
  id = "slack-token"
  description = "Slack Token"
  regex = '''xox[baprs]-[0-9]{10,13}-[0-9]{10,13}[a-zA-Z0-9-]*'''
  tags = ["key", "Slack"]

[[rules]]
  id = "stripe-api-key"
  description = "Stripe API Key"
  regex = '''sk_live_[0-9a-zA-Z]{24,}'''
  tags = ["key", "Stripe"]

[[rules]]
  id = "stripe-test-key"
  description = "Stripe Test Key"
  regex = '''sk_test_[0-9a-zA-Z]{24,}'''
  tags = ["key", "Stripe"]

[[rules]]
  id = "private-key"
  description = "Private Key"
  regex = '''-----BEGIN (RSA |DSA |EC |OPENSSH )?PRIVATE KEY-----'''
  tags = ["key", "private"]

[[rules]]
  id = "jwt-token"
  description = "JWT Token"
  regex = '''eyJ[A-Za-z0-9-_]+\.eyJ[A-Za-z0-9-_]+\.[A-Za-z0-9-_.+/=]*'''
  tags = ["key", "JWT"]

[[rules]]
  id = "database-password"
  description = "Database Password in URL"
  regex = '''(?i)postgres(ql)?://[^:]+:([^@]+)@'''
  tags = ["key", "database"]

[[rules]]
  id = "sendgrid-api-key"
  description = "SendGrid API Key"
  regex = '''SG\.[a-zA-Z0-9-]{22}\.[a-zA-Z0-9-]{43}'''
  tags = ["key", "SendGrid"]

[[rules]]
  id = "mailgun-api-key"
  description = "Mailgun API Key"
  regex = '''key-[0-9a-zA-Z]{32}'''
  tags = ["key", "Mailgun"]

[[rules]]
  id = "twilio-api-key"
  description = "Twilio API Key"
  regex = '''SK[a-zA-Z0-9]{32}'''
  tags = ["key", "Twilio"]

[[rules]]
  id = "google-api-key"
  description = "Google API Key"
  regex = '''AIza[0-9A-Za-z-_]{35}'''
  tags = ["key", "Google"]

[[rules]]
  id = "google-oauth"
  description = "Google OAuth"
  regex = '''[0-9]+-[0-9A-Za-z_]{32}\.apps\.googleusercontent\.com'''
  tags = ["key", "Google"]

[[rules]]
  id = "firebase-token"
  description = "Firebase Token"
  regex = '''eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9'''
  tags = ["key", "Firebase"]

[[rules]]
  id = "heroku-api-key"
  description = "Heroku API Key"
  regex = '''[a-f0-9]{8}-[a-f0-9]{4}-[a-f0-9]{4}-[a-f0-9]{4}-[a-f0-9]{12}'''
  tags = ["key", "Heroku"]

[[rules]]
  id = "dockerhub-token"
  description = "Docker Hub Token"
  regex = '''dockerhub_token_[0-9a-f]{32}'''
  tags = ["key", "Docker"]

[[rules]]
  id = "npm-token"
  description = "NPM Token"
  regex = '''npm_[A-Za-z0-9]{36}'''
  tags = ["key", "npm"]

[[rules]]
  id = "sonarqube-token"
  description = "SonarQube Token"
  regex = '''sqp_[a-zA-Z0-9]{40}'''
  tags = ["key", "SonarQube"]

[[rules]]
  id = "notion-token"
  description = "Notion Token"
  regex = '''secret_[a-zA-Z0-9]{43}'''
  tags = ["key", "Notion"]

[[rules]]
  id = "linear-api-key"
  description = "Linear API Key"
  regex = '''lin_api_[a-zA-Z0-9]{48}'''
  tags = ["key", "Linear"]

[[rules]]
  id = "openai-api-key"
  description = "OpenAI API Key"
  regex = '''sk-[a-zA-Z0-9]{48}'''
  tags = ["key", "OpenAI"]

[[rules]]
  id = "anthropic-api-key"
  description = "Anthropic API Key"
  regex = '''sk-ant-[a-zA-Z0-9-]{50,}'''
  tags = ["key", "Anthropic"]

[[rules]]
  id = "generic-credentials"
  description = "Generic Credentials"
  regex = '''(?i)(username|user|login|usr)\s*[:=]\s*["'][^"']+["']'''
  tags = ["credentials"]

[[rules]]
  id = " Bearer-auth-in-header"
  description = "Bearer Token in Authorization Header"
  regex = '''Authorization:\s*Bearer\s+[a-zA-Z0-9-._~+/]+'''
  tags = ["auth", "bearer"]

# Ignore test fixtures and example files
[[rules]]
  id = "hardcoded-password-test"
  description = "Hardcoded password in test"
  regex = '''password\s*=\s*["'][^"']{8,}["']'''
  path = '''.*test.*'''
  tags = ["test"]

  # Allow in test files only
  [rules.allowlist]
    paths = [
      "(?i).*test.*",
      "(?i).*Test.*\\.kt",
      "(?i).*Tests\\.kt",
    ]