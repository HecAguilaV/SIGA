services:

  # ============================================================
  # Database: PostgreSQL + PGVector
  # Automatically initializes the 5 SIGA schemas
  # ============================================================
  siga-db:
    image: pgvector/pgvector:pg16
    container_name: siga-postgres
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    ports:
      - "${DB_PORT}:5432"
    volumes:
      - siga-db-data:/var/lib/postgresql/data
      - ./scripts/database/DB_SIGA_ENGLISH.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - siga-net

  # ============================================================
  # pgAdmin 4 (Web Interface for PostgreSQL)
  # Access: http://localhost:5050
  # ============================================================
  pgadmin:
    image: dpage/pgadmin4
    container_name: siga-pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_EMAIL}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD}
    ports:
      - "5050:80"
    depends_on:
      siga-db:
        condition: service_healthy
    networks:
      - siga-net

  # ============================================================
  # Eureka Server (Service Registry)
  # ============================================================
  siga-eureka:
    build:
      context: ./services/registry
      dockerfile: Dockerfile
    container_name: siga-eureka
    ports:
      - "8761:8761"
    networks:
      - siga-net

  # ============================================================
  # API Gateway
  # ============================================================
  siga-gateway:
    build:
      context: .
      dockerfile: ./services/gateway/Dockerfile
    container_name: siga-gateway
    ports:
      - "${GATEWAY_PORT}:8080"
    environment:
      - EUREKA_CLIENT_SERVICEURL_DEFAULTZONE=${EUREKA_URL}
    depends_on:
      - siga-eureka
    networks:
      - siga-net

  # ============================================================
  # Microservice: Auth (:8081)
  # Schema: auth
  # ============================================================
  siga-auth:
    build:
      context: .
      dockerfile: ./services/auth/Dockerfile
    container_name: siga-auth
    environment:
      - EUREKA_CLIENT_SERVICEURL_DEFAULTZONE=${EUREKA_URL}
      - SPRING_DATASOURCE_URL=jdbc:postgresql://siga-db:5432/${DB_NAME}?currentSchema=auth
      - SPRING_DATASOURCE_USERNAME=${DB_USER}
      - SPRING_DATASOURCE_PASSWORD=${DB_PASSWORD}
    depends_on:
      siga-db:
        condition: service_healthy
      siga-eureka:
        condition: service_started
    networks:
      - siga-net

  # ============================================================
  # Microservice: Inventory (:8082)
  # Schema: inventory
  # ============================================================
  siga-inventory:
    build:
      context: .
      dockerfile: ./services/inventory/Dockerfile
    container_name: siga-inventory
    environment:
      - EUREKA_CLIENT_SERVICEURL_DEFAULTZONE=${EUREKA_URL}
      - SPRING_DATASOURCE_URL=jdbc:postgresql://siga-db:5432/${DB_NAME}?currentSchema=inventory
      - SPRING_DATASOURCE_USERNAME=${DB_USER}
      - SPRING_DATASOURCE_PASSWORD=${DB_PASSWORD}
    depends_on:
      siga-db:
        condition: service_healthy
      siga-eureka:
        condition: service_started
    networks:
      - siga-net

  # ============================================================
  # Microservice: Sales (:8083)
  # Schema: sales
  # ============================================================
  siga-sales:
    build:
      context: .
      dockerfile: ./services/sales/Dockerfile
    container_name: siga-sales
    environment:
      - EUREKA_CLIENT_SERVICEURL_DEFAULTZONE=${EUREKA_URL}
      - SPRING_DATASOURCE_URL=jdbc:postgresql://siga-db:5432/${DB_NAME}?currentSchema=sales
      - SPRING_DATASOURCE_USERNAME=${DB_USER}
      - SPRING_DATASOURCE_PASSWORD=${DB_PASSWORD}
    depends_on:
      siga-db:
        condition: service_healthy
      siga-eureka:
        condition: service_started
      siga-inventory:
        condition: service_started
    networks:
      - siga-net

  # ============================================================
  # Microservice: Commercial/Billing (:8084)
  # Schema: commercial
  # ============================================================
  siga-billing:
    build:
      context: .
      dockerfile: ./services/billing/Dockerfile
    container_name: siga-billing
    environment:
      - EUREKA_CLIENT_SERVICEURL_DEFAULTZONE=${EUREKA_URL}
      - SPRING_DATASOURCE_URL=jdbc:postgresql://siga-db:5432/${DB_NAME}?currentSchema=commercial
      - SPRING_DATASOURCE_USERNAME=${DB_USER}
      - SPRING_DATASOURCE_PASSWORD=${DB_PASSWORD}
    depends_on:
      siga-db:
        condition: service_healthy
      siga-eureka:
        condition: service_started
    networks:
      - siga-net

  # ============================================================
  # Microservice: AI Agent (:8000)
  # Schema: agent
  # ============================================================
  siga-agent:
    build:
      context: ./services/agent
      dockerfile: Dockerfile
    container_name: siga-agent
    environment:
      - EUREKA_CLIENT_SERVICEURL_DEFAULTZONE=${EUREKA_URL}
      - PORT=${AGENT_PORT}
      - DATABASE_URL=postgresql://${DB_USER}:${DB_PASSWORD}@${DB_HOST}:${DB_PORT}/${DB_NAME}?schema=agent
    depends_on:
      siga-db:
        condition: service_healthy
      siga-eureka:
        condition: service_started
    networks:
      - siga-net

volumes:
  siga-db-data:

networks:
  siga-net:
    driver: bridge
