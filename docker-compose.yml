services:

  # ============================================================
  # Database: PostgreSQL + PGVector
  # Automatically initializes the 5 SIGA schemas
  # ============================================================
  siga-db:
    image: pgvector/pgvector:pg16
    container_name: siga-postgres
    environment:
      POSTGRES_DB: siga_db
      POSTGRES_USER: siga_admin
      POSTGRES_PASSWORD: siga_dev_2026
    ports:
      - "5432:5432"
    volumes:
      - siga-db-data:/var/lib/postgresql/data
      - ./scripts/database/DB_SIGA_ENGLISH.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U siga_admin -d siga_db"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - siga-net

  # ============================================================
  # pgAdmin 4 (Web Interface for PostgreSQL)
  # Access: http://localhost:5050
  # ============================================================
  pgadmin:
    image: dpage/pgadmin4
    container_name: siga-pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@siga.cl
      PGADMIN_DEFAULT_PASSWORD: admin
    ports:
      - "5050:80"
    depends_on:
      siga-db:
        condition: service_healthy
    networks:
      - siga-net

  # ============================================================
  # Eureka Server (Service Registry)
  # ============================================================
  siga-eureka:
    build:
      context: ./services/registry
      dockerfile: Dockerfile
    container_name: siga-eureka
    ports:
      - "8761:8761"
    networks:
      - siga-net

  # ============================================================
  # API Gateway
  # ============================================================
  siga-gateway:
    build:
      context: ./services/gateway
      dockerfile: Dockerfile
    container_name: siga-gateway
    ports:
      - "8080:8080"
    environment:
      - EUREKA_CLIENT_SERVICEURL_DEFAULTZONE=http://siga-eureka:8761/eureka/
    depends_on:
      - siga-eureka
    networks:
      - siga-net

  # ============================================================
  # Microservice: Auth (:8081)
  # Schema: auth
  # ============================================================
  siga-auth:
    build:
      context: .
      dockerfile: ./services/auth/Dockerfile
    container_name: siga-auth
    environment:
      - EUREKA_CLIENT_SERVICEURL_DEFAULTZONE=http://siga-eureka:8761/eureka/
      - SPRING_DATASOURCE_URL=jdbc:postgresql://siga-db:5432/siga_db?currentSchema=auth
      - SPRING_DATASOURCE_USERNAME=siga_admin
      - SPRING_DATASOURCE_PASSWORD=siga_dev_2026
    depends_on:
      siga-db:
        condition: service_healthy
      siga-eureka:
        condition: service_started
    networks:
      - siga-net

  # ============================================================
  # Microservice: Inventory (:8082)
  # Schema: inventory
  # ============================================================
  siga-inventory:
    build:
      context: .
      dockerfile: ./services/inventory/Dockerfile
    container_name: siga-inventory
    environment:
      - EUREKA_CLIENT_SERVICEURL_DEFAULTZONE=http://siga-eureka:8761/eureka/
      - SPRING_DATASOURCE_URL=jdbc:postgresql://siga-db:5432/siga_db?currentSchema=inventory
      - SPRING_DATASOURCE_USERNAME=siga_admin
      - SPRING_DATASOURCE_PASSWORD=siga_dev_2026
    depends_on:
      siga-db:
        condition: service_healthy
      siga-eureka:
        condition: service_started
    networks:
      - siga-net

  # ============================================================
  # Microservice: Sales (:8083)
  # Schema: sales
  # ============================================================
  siga-sales:
    build:
      context: .
      dockerfile: ./services/sales/Dockerfile
    container_name: siga-sales
    environment:
      - EUREKA_CLIENT_SERVICEURL_DEFAULTZONE=http://siga-eureka:8761/eureka/
      - SPRING_DATASOURCE_URL=jdbc:postgresql://siga-db:5432/siga_db?currentSchema=sales
      - SPRING_DATASOURCE_USERNAME=siga_admin
      - SPRING_DATASOURCE_PASSWORD=siga_dev_2026
    depends_on:
      siga-db:
        condition: service_healthy
      siga-eureka:
        condition: service_started
      siga-inventory:
        condition: service_started
    networks:
      - siga-net

  # ============================================================
  # Microservice: Commercial/Billing (:8084)
  # Schema: commercial
  # ============================================================
  siga-billing:
    build:
      context: .
      dockerfile: ./services/billing/Dockerfile
    container_name: siga-billing
    environment:
      - EUREKA_CLIENT_SERVICEURL_DEFAULTZONE=http://siga-eureka:8761/eureka/
      - SPRING_DATASOURCE_URL=jdbc:postgresql://siga-db:5432/siga_db?currentSchema=commercial
      - SPRING_DATASOURCE_USERNAME=siga_admin
      - SPRING_DATASOURCE_PASSWORD=siga_dev_2026
    depends_on:
      siga-db:
        condition: service_healthy
      siga-eureka:
        condition: service_started
    networks:
      - siga-net

  # ============================================================
  # Microservice: AI Agent (:8000)
  # Schema: agent
  # ============================================================
  siga-agent:
    build:
      context: ./services/agent
      dockerfile: Dockerfile
    container_name: siga-agent
    environment:
      - EUREKA_CLIENT_SERVICEURL_DEFAULTZONE=http://siga-eureka:8761/eureka/
      - PORT=8000
      - DATABASE_URL=postgresql://siga_admin:siga_dev_2026@siga-db:5432/siga_db?schema=agent
    depends_on:
      siga-db:
        condition: service_healthy
      siga-eureka:
        condition: service_started
    networks:
      - siga-net

volumes:
  siga-db-data:

networks:
  siga-net:
    driver: bridge
