services:

  # ============================================================
  # LAYER 0 — PERSISTENCE
  # PostgreSQL 16 + PGVector extension for AI vector search.
  # Single instance hosts all service databases (database-per-service
  # via separate schemas). init-db.sh creates schemas and users on
  # first run; Flyway owns all DDL from that point forward.
  # ============================================================
  siga-db:
    image: pgvector/pgvector:pg16              # PostgreSQL 16 with pgvector for AI embeddings
    container_name: siga-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "${DB_PORT}:5432"
    volumes:
      - siga-db-data:/var/lib/postgresql/data
      - ./scripts/db-init/init-db.sh:/docker-entrypoint-initdb.d/init-db.sh:ro
      - ./scripts/db-init/backup_sql:/docker-entrypoint-initdb.d/sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - siga-net

  # ============================================================
  # LAYER 0 — EVENT STREAMING
  # Apache Kafka in KRaft mode (no Zookeeper). Handles SAGA
  # choreography events between microservices (e.g. sale → stock
  # reservation → billing invoice). Single-node for dev/staging.
  # ============================================================
  siga-kafka:
    image: confluentinc/cp-kafka:latest        # Confluent Kafka — KRaft mode (no Zookeeper)
    container_name: siga-kafka
    ports:
      - "${KAFKA_PORT}:9092"
    environment:
      - KAFKA_NODE_ID=1
      - KAFKA_LISTENER_SECURITY_PROTOCOL_MAP=CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      - KAFKA_ADVERTISED_LISTENERS=PLAINTEXT://siga-kafka:29092,PLAINTEXT_HOST://localhost:9092
      - KAFKA_JMX_PORT=9101
      - KAFKA_JMX_HOSTNAME=localhost
      - KAFKA_PROCESS_ROLES=broker,controller
      - KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR=1
      - KAFKA_CONTROLLER_QUORUM_VOTERS=1@siga-kafka:29093
      - KAFKA_LISTENERS=PLAINTEXT://siga-kafka:29092,CONTROLLER://siga-kafka:29093,PLAINTEXT_HOST://0.0.0.0:9092
      - KAFKA_INTER_BROKER_LISTENER_NAME=PLAINTEXT
      - KAFKA_CONTROLLER_LISTENER_NAMES=CONTROLLER
      - KAFKA_LOG_DIRS=/var/lib/kafka/data
      - CLUSTER_ID=MkU3OEVBNTcwNTJDRkFCMz
    networks:
      - siga-net

  # ============================================================
  # LAYER 0 — CACHE
  # Redis 7 for declarative caching via Spring Cache abstraction.
  # Single-node for dev/staging. Cluster mode can be added later
  # if cache pressure grows beyond single-instance capacity.
  # ============================================================
  siga-redis:
    image: redis:7-alpine
    container_name: siga-redis
    ports:
      - "${REDIS_PORT}:6379"
    networks:
      - siga-net

  # ============================================================
  # LAYER 0 — ADMIN UIs
  # Web-based management panels for Postgres, Redis, and Kafka.
  # Not required for the application to work — purely for
  # developer/DBA convenience during development and debugging.
  # ============================================================
  siga-kafka-ui:
    image: provectuslabs/kafka-ui:latest       # Web UI for Kafka topic inspection and consumer groups
    container_name: siga-kafka-ui
    ports:
      - "${KAFKA_UI_PORT}:8080"
    environment:
      - KAFKA_CLUSTERS_0_NAME=siga-cluster
      - KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS=siga-kafka:29092
    depends_on:
      - siga-kafka
    networks:
      - siga-net

  pgadmin:
    image: dpage/pgadmin4                      # Web UI for PostgreSQL administration and query execution
    container_name: siga-pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_EMAIL}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD}
    ports:
      - "5050:80"
    volumes:
      - siga-pgadmin-data:/var/lib/pgadmin
    depends_on:
      siga-db:
        condition: service_healthy
    networks:
      - siga-net

  # ============================================================
  # LAYER 1 — SERVICE DISCOVERY & API GATEWAY
  # Eureka handles service registration; Gateway routes all
  # external traffic to internal microservices via RewritePath
  # rules (e.g. /api/auth/* → siga-auth /api/v1/*).
  # ============================================================
  siga-eureka:
    image: hdaguila/siga-eureka:latest         # Netflix Eureka — service registry and discovery
    build:
      context: .
      dockerfile: ./services/registry/Dockerfile
    container_name: siga-eureka
    ports:
      - "8761:8761"
    networks:
      - siga-net

  siga-gateway:
    image: hdaguila/siga-gateway:latest        # Spring Cloud Gateway — API routing with RewritePath
    build:
      context: .
      dockerfile: ./services/gateway/Dockerfile
    container_name: siga-gateway
    ports:
      - "${GATEWAY_PORT}:8080"
    environment:
      - EUREKA_CLIENT_SERVICEURL_DEFAULTZONE=${EUREKA_URL}
    depends_on:
      - siga-eureka
    networks:
      - siga-net

  # ============================================================
  # LAYER 2 — CORE MICROSERVICES (Hexagonal Architecture)
  # Each service owns its database schema (database-per-service).
  # All follow Hexagonal Architecture: domain/port → adapter → usecase.
  # Communication: REST (sync via Gateway) + Kafka (async SAGA).
  # ============================================================

  # Auth: Identity, RBAC permissions, JWT, email verification.
  # Owns: siga_auth database, auth schema.
  siga-auth:
    image: hdaguila/siga-auth:latest
    build:
      context: .
      dockerfile: ./services/auth/Dockerfile
    container_name: siga-auth
    environment:
      - EUREKA_CLIENT_SERVICEURL_DEFAULTZONE=${EUREKA_URL}
      - SPRING_DATASOURCE_URL=jdbc:postgresql://siga-db:5432/${AUTH_DB_NAME}
      - SPRING_DATASOURCE_USERNAME=${AUTH_DB_USER}
      - SPRING_DATASOURCE_PASSWORD=${AUTH_DB_PASSWORD}
      - JWT_SECRET=${JWT_SECRET}
    depends_on:
      siga-db:
        condition: service_healthy
      siga-eureka:
        condition: service_started
    networks:
      - siga-net

  # Inventory: Stock control, SKU generation, reconciliation, transfers.
  # Owns: siga_inventory database, inventory schema.
  # Kafka consumer: listens for sale events to reserve stock (SAGA).
  siga-inventory:
    image: hdaguila/siga-inventory:latest
    build:
      context: .
      dockerfile: ./services/inventory/Dockerfile
    container_name: siga-inventory
    environment:
      - EUREKA_CLIENT_SERVICEURL_DEFAULTZONE=${EUREKA_URL}
      - SPRING_DATASOURCE_URL=jdbc:postgresql://siga-db:5432/${INVENTORY_DB_NAME}
      - SPRING_DATASOURCE_USERNAME=${INVENTORY_DB_USER}
      - SPRING_DATASOURCE_PASSWORD=${INVENTORY_DB_PASSWORD}
      - KAFKA_BOOTSTRAP_SERVERS=siga-kafka:29092
    depends_on:
      siga-db:
        condition: service_healthy
      siga-eureka:
        condition: service_started
      siga-kafka:
        condition: service_started
    networks:
      - siga-net

  # Sales: POS, internal invoicing for the SME.
  # Owns: siga_sales database, sales schema.
  # Kafka producer: emits sale events for SAGA choreography.
  siga-sales:
    image: hdaguila/siga-sales:latest
    build:
      context: .
      dockerfile: ./services/sales/Dockerfile
    container_name: siga-sales
    environment:
      - EUREKA_CLIENT_SERVICEURL_DEFAULTZONE=${EUREKA_URL}
      - SPRING_DATASOURCE_URL=jdbc:postgresql://siga-db:5432/${SALES_DB_NAME}
      - SPRING_DATASOURCE_USERNAME=${SALES_DB_USER}
      - SPRING_DATASOURCE_PASSWORD=${SALES_DB_PASSWORD}
      - KAFKA_BOOTSTRAP_SERVERS=siga-kafka:29092
    depends_on:
      siga-db:
        condition: service_healthy
      siga-eureka:
        condition: service_started
      siga-kafka:
        condition: service_started
    networks:
      - siga-net

  # Billing: SaaS subscription management and payment processing.
  # Owns: siga_billing database, billing schema.
  # Kafka consumer: receives sale events to generate invoices (SAGA step 4).
  siga-billing:
    image: hdaguila/siga-billing:latest
    build:
      context: .
      dockerfile: ./services/billing/Dockerfile
    container_name: siga-billing
    environment:
      - EUREKA_CLIENT_SERVICEURL_DEFAULTZONE=${EUREKA_URL}
      - SPRING_DATASOURCE_URL=jdbc:postgresql://siga-db:5432/${BILLING_DB_NAME}
      - SPRING_DATASOURCE_USERNAME=${BILLING_DB_USER}
      - SPRING_DATASOURCE_PASSWORD=${BILLING_DB_PASSWORD}
      - KAFKA_BOOTSTRAP_SERVERS=siga-kafka:29092
    depends_on:
      siga-db:
        condition: service_healthy
      siga-eureka:
        condition: service_started
      siga-kafka:
        condition: service_started
    networks:
      - siga-net

  # Notification: Async email delivery via Kafka consumer.
  # Owns: siga_notification database, notification schema.
  # Kafka consumer: listens for email events to send verification/reset emails.
  siga-notification:
    image: hdaguila/siga-notification:latest
    build:
      context: .
      dockerfile: ./services/notification/Dockerfile
    container_name: siga-notification
    environment:
      - EUREKA_CLIENT_SERVICEURL_DEFAULTZONE=${EUREKA_URL}
      - SPRING_DATASOURCE_URL=jdbc:postgresql://siga-db:5432/${NOTIFICATION_DB_NAME}
      - SPRING_DATASOURCE_USERNAME=${NOTIFICATION_DB_USER}
      - SPRING_DATASOURCE_PASSWORD=${NOTIFICATION_DB_PASSWORD}
      - KAFKA_BOOTSTRAP_SERVERS=siga-kafka:29092
      - SPRING_MAIL_HOST=${SPRING_MAIL_HOST}
      - SPRING_MAIL_PORT=${SPRING_MAIL_PORT}
      - SPRING_MAIL_USERNAME=${SPRING_MAIL_USERNAME}
      - SPRING_MAIL_PASSWORD=${SPRING_MAIL_PASSWORD}
    depends_on:
      siga-db:
        condition: service_healthy
      siga-eureka:
        condition: service_started
      siga-kafka:
        condition: service_started
    networks:
      - siga-net

  # ============================================================
  # LAYER 3 — AI AGENT (Optional — requires Gemini API Key)
  # A2UI v0.9 agent powered by Gemini. Activated only with
  # the "agent" profile: docker compose --profile agent up -d
  # ============================================================
  siga-agent:
    image: hdaguila/siga-agent:latest          # Kotlin agent — A2UI v0.9 + Gemini 3 Flash
    build:
      context: .
      dockerfile: ./services/agent/Dockerfile
    container_name: siga-agent
    profiles:
      - agent
    ports:
      - "${AGENT_PORT}:8000"
    environment:
      - EUREKA_CLIENT_SERVICEURL_DEFAULTZONE=${EUREKA_URL}
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - GEMINI_MODEL_ID=${GEMINI_MODEL_ID}
    depends_on:
      siga-eureka:
        condition: service_started
    networks:
      - siga-net

  # ============================================================
  # LAYER 4 — OPS & OBSERVABILITY
  # Developer tools for monitoring the Docker environment.
  # ContainerFlow: real-time Docker architecture visualizer with
  # interactive topology graph, container logs, exec terminal,
  # CPU/RAM metrics, and best-practice recommendations.
  # Source: https://github.com/RGJorge/ContainerFlow
  # License: AGPL-3.0
  # ============================================================
  siga-ops:
    image: ghcr.io/rgjorge/containerflow:latest  # ContainerFlow — Docker architecture visualizer
    container_name: siga-ops
    ports:
      - "${OPS_PORT:-9470}:9470"
    environment:
      - PORT=9470
      - AUTH_TOKEN=${OPS_AUTH_TOKEN}             # Activa acceso remoto (bind a 0.0.0.0) y pantalla de login
      - ALLOW_NON_COMPOSE=true                   # Show containers not managed by Compose
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro  # Read-only access to Docker socket
      - containerflow-data:/app/data                    # Persist Discord config, thresholds, stats history
    networks:
      - siga-net

volumes:
  siga-db-data:      # Persistent PostgreSQL data (survives container recreation)
  siga-pgadmin-data: # Persistent pgAdmin configuration and saved connections
  containerflow-data: # Persistent siga-ops data: Discord config, thresholds, stats history

networks:
  siga-net:
    driver: bridge   # Default bridge network — all services communicate by container name
