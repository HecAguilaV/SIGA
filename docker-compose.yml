services:

  # ============================================================
  # LAYER 0 — PERSISTENCE
  # PostgreSQL 16 + PGVector extension for AI vector search.
  # ============================================================
  siga-db:
    image: pgvector/pgvector:pg16
    container_name: siga-postgres
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 1G
          cpus: '1.0'
        reservations:
          memory: 256M
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "${DB_PORT}:5432"
    volumes:
      - siga-db-data:/var/lib/postgresql/data
      - ./scripts/db-init/init-db.sh:/docker-entrypoint-initdb.d/init-db.sh:ro
      - ./scripts/db-init/backup_sql:/docker-entrypoint-initdb.d/sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - siga-net

  # ============================================================
  # LAYER 0 — EVENT STREAMING
  # Apache Kafka in KRaft mode.
  # ============================================================
  siga-kafka:
    image: confluentinc/cp-kafka:latest
    container_name: siga-kafka
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 1G
          cpus: '1.0'
        reservations:
          memory: 512M
    ports:
      - "${KAFKA_PORT}:9092"
    environment:
      - KAFKA_NODE_ID=1
      - KAFKA_LISTENER_SECURITY_PROTOCOL_MAP=CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      - KAFKA_ADVERTISED_LISTENERS=PLAINTEXT://siga-kafka:29092,PLAINTEXT_HOST://localhost:9092
      - KAFKA_JMX_PORT=9101
      - KAFKA_JMX_HOSTNAME=localhost
      - KAFKA_PROCESS_ROLES=broker,controller
      - KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR=1
      - KAFKA_CONTROLLER_QUORUM_VOTERS=1@siga-kafka:29093
      - KAFKA_LISTENERS=PLAINTEXT://siga-kafka:29092,CONTROLLER://siga-kafka:29093,PLAINTEXT_HOST://0.0.0.0:9092
      - KAFKA_INTER_BROKER_LISTENER_NAME=PLAINTEXT
      - KAFKA_CONTROLLER_LISTENER_NAMES=CONTROLLER
      - KAFKA_LOG_DIRS=/var/lib/kafka/data
      - CLUSTER_ID=MkU3OEVBNTcwNTJDRkFCMz
    networks:
      - siga-net

  # ============================================================
  # LAYER 0 — CACHE
  # Redis 7 for declarative caching.
  # ============================================================
  siga-redis:
    image: redis:7-alpine
    container_name: siga-redis
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: '1.0'
        reservations:
          memory: 64M
    ports:
      - "${REDIS_PORT_FIXED:-6379}:6379"
    networks:
      - siga-net

  # ============================================================
  # LAYER 0 — ADMIN UIs
  # ============================================================
  siga-kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: siga-kafka-ui
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: '1.0'
    ports:
      - "${KAFKA_UI_PORT}:8080"
    environment:
      - KAFKA_CLUSTERS_0_NAME=siga-cluster
      - KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS=siga-kafka:29092
    depends_on:
      - siga-kafka
    networks:
      - siga-net

  pgadmin:
    image: dpage/pgadmin4
    container_name: siga-pgadmin
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: '1.0'
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_EMAIL}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD}
    ports:
      - "5050:80"
    volumes:
      - siga-pgadmin-data:/var/lib/pgadmin
      - ./scripts/pgadmin/servers.json:/pgadmin4/servers.json:ro
      - ./scripts/pgadmin/pgpass:/tmp/pgpass:ro
    depends_on:
      siga-db:
        condition: service_healthy
    networks:
      - siga-net

  # ============================================================
  # LAYER 1 — SERVICE DISCOVERY & API GATEWAY
  # ============================================================
  siga-eureka:
    image: hdaguila/siga-eureka:latest
    build:
      context: .
      dockerfile: ./services/registry/Dockerfile
    container_name: siga-eureka
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: '1.0'
        reservations:
          memory: 256M
    ports:
      - "8761:8761"
    networks:
      - siga-net

  siga-gateway:
    image: hdaguila/siga-gateway:latest
    build:
      context: .
      dockerfile: ./services/gateway/Dockerfile
    container_name: siga-gateway
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: '1.0'
        reservations:
          memory: 256M
    ports:
      - "${GATEWAY_PORT}:8080"
    environment:
      - EUREKA_CLIENT_SERVICEURL_DEFAULTZONE=${EUREKA_URL}
    depends_on:
      - siga-eureka
    networks:
      - siga-net

  # ============================================================
  # LAYER 2 — CORE MICROSERVICES
  # ============================================================

  siga-auth:
    image: hdaguila/siga-auth:latest
    build:
      context: .
      dockerfile: ./services/auth/Dockerfile
    container_name: siga-auth
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 768M
          cpus: '1.0'
        reservations:
          memory: 384M
    environment:
      - EUREKA_CLIENT_SERVICEURL_DEFAULTZONE=${EUREKA_URL}
      - SPRING_DATASOURCE_URL=jdbc:postgresql://siga-db:5432/${AUTH_DB_NAME}
      - SPRING_DATASOURCE_USERNAME=${AUTH_DB_USER}
      - SPRING_DATASOURCE_PASSWORD=${AUTH_DB_PASSWORD}
      - JWT_SECRET=${JWT_SECRET}
      - KAFKA_BOOTSTRAP_SERVERS=siga-kafka:29092
      - SPRING_MAIL_HOST=${SPRING_MAIL_HOST}
      - SPRING_MAIL_PORT=${SPRING_MAIL_PORT}
      - SPRING_MAIL_USERNAME=${SPRING_MAIL_USERNAME}
      - SPRING_MAIL_PASSWORD=${SPRING_MAIL_PASSWORD}
      - REDIS_HOST=siga-redis
      - SPRING_JPA_HIBERNATE_DDL_AUTO=update
      - SPRING_PROFILES_ACTIVE=prod
      - APP_EMAIL_MODE=async
    depends_on:
      siga-db:
        condition: service_healthy
      siga-eureka:
        condition: service_started
    networks:
      - siga-net

  siga-inventory:
    image: hdaguila/siga-inventory:latest
    build:
      context: .
      dockerfile: ./services/inventory/Dockerfile
    container_name: siga-inventory
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 768M
          cpus: '1.0'
        reservations:
          memory: 384M
    environment:
      - EUREKA_CLIENT_SERVICEURL_DEFAULTZONE=${EUREKA_URL}
      - SPRING_DATASOURCE_URL=jdbc:postgresql://siga-db:5432/${INVENTORY_DB_NAME}
      - SPRING_DATASOURCE_USERNAME=${INVENTORY_DB_USER}
      - SPRING_DATASOURCE_PASSWORD=${INVENTORY_DB_PASSWORD}
      - KAFKA_BOOTSTRAP_SERVERS=siga-kafka:29092
      - REDIS_HOST=siga-redis
      - SPRING_JPA_HIBERNATE_DDL_AUTO=update
      - JWT_SECRET=${JWT_SECRET}
    depends_on:
      siga-db:
        condition: service_healthy
      siga-eureka:
        condition: service_started
      siga-kafka:
        condition: service_started
    networks:
      - siga-net

  siga-sales:
    image: hdaguila/siga-sales:latest
    build:
      context: .
      dockerfile: ./services/sales/Dockerfile
    container_name: siga-sales
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 768M
          cpus: '1.0'
        reservations:
          memory: 384M
    environment:
      - EUREKA_CLIENT_SERVICEURL_DEFAULTZONE=${EUREKA_URL}
      - SPRING_DATASOURCE_URL=jdbc:postgresql://siga-db:5432/${SALES_DB_NAME}
      - SPRING_DATASOURCE_USERNAME=${SALES_DB_USER}
      - SPRING_DATASOURCE_PASSWORD=${SALES_DB_PASSWORD}
      - KAFKA_BOOTSTRAP_SERVERS=siga-kafka:29092
      - REDIS_HOST=siga-redis
      - SPRING_JPA_HIBERNATE_DDL_AUTO=update
    depends_on:
      siga-db:
        condition: service_healthy
      siga-eureka:
        condition: service_started
      siga-kafka:
        condition: service_started
    networks:
      - siga-net

  siga-billing:
    image: hdaguila/siga-billing:latest
    build:
      context: .
      dockerfile: ./services/billing/Dockerfile
    container_name: siga-billing
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 768M
          cpus: '1.0'
        reservations:
          memory: 384M
    environment:
      - EUREKA_CLIENT_SERVICEURL_DEFAULTZONE=${EUREKA_URL}
      - SPRING_DATASOURCE_URL=jdbc:postgresql://siga-db:5432/${BILLING_DB_NAME}
      - SPRING_DATASOURCE_USERNAME=${BILLING_DB_USER}
      - SPRING_DATASOURCE_PASSWORD=${BILLING_DB_PASSWORD}
      - KAFKA_BOOTSTRAP_SERVERS=siga-kafka:29092
      - REDIS_HOST=siga-redis
      - SPRING_JPA_HIBERNATE_DDL_AUTO=update
    depends_on:
      siga-db:
        condition: service_healthy
      siga-eureka:
        condition: service_started
      siga-kafka:
        condition: service_started
    networks:
      - siga-net

  siga-notification:
    image: hdaguila/siga-notification:latest
    build:
      context: .
      dockerfile: ./services/notification/Dockerfile
    container_name: siga-notification
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 768M
          cpus: '1.0'
        reservations:
          memory: 384M
    environment:
      - EUREKA_CLIENT_SERVICEURL_DEFAULTZONE=${EUREKA_URL}
      - SPRING_DATASOURCE_URL=jdbc:postgresql://siga-db:5432/${NOTIFICATION_DB_NAME}
      - SPRING_DATASOURCE_USERNAME=${NOTIFICATION_DB_USER}
      - SPRING_DATASOURCE_PASSWORD=${NOTIFICATION_DB_PASSWORD}
      - KAFKA_BOOTSTRAP_SERVERS=siga-kafka:29092
      - SPRING_MAIL_HOST=${SPRING_MAIL_HOST}
      - SPRING_MAIL_PORT=${SPRING_MAIL_PORT}
      - SPRING_MAIL_USERNAME=${SPRING_MAIL_USERNAME}
      - SPRING_MAIL_PASSWORD=${SPRING_MAIL_PASSWORD}
      - REDIS_HOST=siga-redis
      - SPRING_JPA_HIBERNATE_DDL_AUTO=update
      - SPRING_PROFILES_ACTIVE=prod
      - APP_VERIFY_BASE_URL=http://localhost:3000
    depends_on:
      siga-db:
        condition: service_healthy
      siga-eureka:
        condition: service_started
      siga-kafka:
        condition: service_started
    networks:
      - siga-net

  # ============================================================
  # LAYER 3 — AI AGENT
  # ============================================================
  siga-agent:
    image: hdaguila/siga-agent:latest
    build:
      context: .
      dockerfile: ./services/agent/Dockerfile
    container_name: siga-agent
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: '1.0'
    profiles:
      - agent
    ports:
      - "${AGENT_PORT}:8000"
    environment:
      - EUREKA_CLIENT_SERVICEURL_DEFAULTZONE=${EUREKA_URL}
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - GEMINI_MODEL_ID=${GEMINI_MODEL_ID}
    depends_on:
      siga-eureka:
        condition: service_started
    networks:
      - siga-net

  # ──────────────────────────────────────────────────────────
  # SIGA Dashboard — Frontend SvelteKit (BFF)
  # ──────────────────────────────────────────────────────────
  siga-dashboard:
    build:
      context: .
      dockerfile: ./apps/dashboard/Dockerfile
    container_name: siga-dashboard
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
      - HOST=0.0.0.0
      - GATEWAY_BASE_URL=http://siga-gateway:8080
      - AGENT_BASE=http://siga-agent:8000
      - PUBLIC_GATEWAY_URL=http://localhost:8080
      - PUBLIC_API_URL=http://localhost:8080/api/v1
      - PUBLIC_APP_NAME=SIGA
      - PUBLIC_APP_VERSION=1.0.0
      - ORIGIN=http://localhost:3000
    depends_on:
      siga-gateway:
        condition: service_started
    networks:
      - siga-net

  # ============================================================
  # LAYER 4 — OPS & OBSERVABILITY
  # ============================================================
  siga-ops:
    image: hdaguila/siga-containerflow:latest
    container_name: siga-ops
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: '1.0'
    ports:
      - "${OPS_PORT:-9470}:9470"
    environment:
      - PORT=9470
      - AUTH_TOKEN=${OPS_AUTH_TOKEN}
      - ALLOW_NON_COMPOSE=true
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - containerflow-data:/app/data
    networks:
      - siga-net

  # ============================================================
  # LAYER 4 — DEV BOT (Discord → Dashboard notifications)
  # ============================================================
  siga-dev-bot:
    image: hdaguila/siga-dev-bot:latest
    build:
      context: ./apps/siga-dev-bot
      dockerfile: Dockerfile
    container_name: siga-dev-bot
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 128M
          cpus: '0.5'
    ports:
      - "${DEV_BOT_PORT:-9510}:9510"
    environment:
      - PORT=9510
      - DISCORD_TOKEN=${DISCORD_BOT_TOKEN}
      - DISCORD_CHANNEL_ID=${DISCORD_DEV_CHANNEL}
      - AUTH_TOKEN=${OPS_AUTH_TOKEN}
    volumes:
      - dev-bot-data:/app/data
    networks:
      - siga-net

volumes:
  siga-db-data:
  siga-pgadmin-data:
  containerflow-data:
  dev-bot-data:

networks:
  siga-net:
    driver: bridge
