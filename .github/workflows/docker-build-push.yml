name: Docker Build and Push

on:
  push:
    branches:
      - main
      - migracion-microservicios

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - service: auth
            context: .
            dockerfile: ./services/auth/Dockerfile
            image: hdaguila/siga-auth
          - service: billing
            context: .
            dockerfile: ./services/billing/Dockerfile
            image: hdaguila/siga-billing
          - service: gateway
            context: .
            dockerfile: ./services/gateway/Dockerfile
            image: hdaguila/siga-gateway
          - service: inventory
            context: .
            dockerfile: ./services/inventory/Dockerfile
            image: hdaguila/siga-inventory
          - service: sales
            context: .
            dockerfile: ./services/sales/Dockerfile
            image: hdaguila/siga-sales
          - service: registry
            context: .
            dockerfile: ./services/registry/Dockerfile
            image: hdaguila/siga-eureka
          - service: agent
            context: .
            dockerfile: ./services/agent/Dockerfile
            image: hdaguila/siga-agent

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          push: true
          tags: |
            ${{ matrix.image }}:latest
            ${{ matrix.image }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
