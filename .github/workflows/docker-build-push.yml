# =============================================================================
# Pipeline CI/CD — Build & Deploy a EKS
# =============================================================================
# Propósito: Reemplazar el pipeline anterior (Docker Hub) por ECR + EKS.
#
# Decisión técnica:
# Se migra de Docker Hub a Amazon ECR porque:
#   1. ECR está en la misma región que EKS (menor latencia, sin costos de salida)
#   2. Integración nativa con EKS (IAM para pull de imágenes)
#   3. Escaneo de vulnerabilidades integrado (Amazon Inspector)
#   4. Sin límite de pulls anónimos (problema común en Docker Hub en CI)
#   5. Requisito explícito de la evaluación DevOps (IE4: Pipeline CI/CD)
#
# Flujo:
#   1. Checkout del código
#   2. Login a ECR via AWS credentials
#   3. Build y push de cada microservicio + frontend a ECR
#   4. Deploy a EKS con kubectl (solo en push a main)
#
# Costo: Los primeros 500 MB/mes son gratuitos en ECR.
# Almacenamiento estimado: ~200 MB por imagen * 9 servicios * 10 versiones = ~$2/mes
#
# Secrets requeridos (configurar en GitHub → Settings → Secrets and variables):
#   - AWS_ACCESS_KEY_ID: Access Key de AWS IAM User
#   - AWS_SECRET_ACCESS_KEY: Secret Key correspondiente
#   - AWS_ACCOUNT_ID: ID de la cuenta AWS (12 dígitos, ej: 123456789012)
# =============================================================================

name: Build & Deploy to EKS

on:
  push:
    branches:
      - main
      - migracion-microservicios
  workflow_dispatch:       # Permite ejecución manual desde la UI de GitHub
    inputs:
      deploy-to-eks:
        description: '¿Desplegar en EKS después del build?'
        required: true
        default: 'true'    # Por defecto despliega, pero se puede cambiar
        type: choice
        options:
          - 'true'
          - 'false'

# =============================================================================
# Variables de entorno globales (configuración del cluster EKS)
# =============================================================================
env:
  AWS_REGION: us-east-1
  EKS_CLUSTER_NAME: siga-production-cluster

jobs:
  # ===========================================================================
  # Job 1: Build y Push a Amazon ECR
  # ===========================================================================
  # Este job corre para CADA servicio definido en la matrix (9 en total).
  # Los builds son independientes entre sí y corren en paralelo.
  # ===========================================================================
  build-and-push:
    name: Build & Push to ECR
    runs-on: ubuntu-latest

    strategy:
      max-parallel: 4
      matrix:
        include:
          # ---- Microservicios Backend (Spring Boot / Gradle) ----
          - service: gateway
            context: .
            dockerfile: ./services/gateway/Dockerfile
          - service: auth
            context: .
            dockerfile: ./services/auth/Dockerfile
          - service: inventory
            context: .
            dockerfile: ./services/inventory/Dockerfile
          - service: sales
            context: .
            dockerfile: ./services/sales/Dockerfile
          - service: billing
            context: .
            dockerfile: ./services/billing/Dockerfile
          - service: notification
            context: .
            dockerfile: ./services/notification/Dockerfile
          - service: agent
            context: .
            dockerfile: ./services/agent/Dockerfile
          - service: registry
            context: .
            dockerfile: ./services/registry/Dockerfile
          # ---- Frontend (SvelteKit / pnpm) ----
          - service: dashboard
            context: .
            dockerfile: ./apps/dashboard/Dockerfile

    steps:
      # -----------------------------------------------------------------------
      # Paso 1: Checkout del repositorio
      # -----------------------------------------------------------------------
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: "main"

      # -----------------------------------------------------------------------
      # Paso 2: Configurar Docker Buildx (necesario para multi-plataforma y cache)
      # -----------------------------------------------------------------------
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # -----------------------------------------------------------------------
      # Paso 3: Configurar credenciales AWS
      # -----------------------------------------------------------------------
      # Decisión: Usar Access Key + Secret Key directas de GitHub Secrets.
      # Alternativa más segura: OIDC (OpenID Connect) que evita almacenar
      # credenciales estáticas. Para el alcance de esta evaluación, Access Key
      # es suficiente. Para producción, implementar OIDC.
      # -----------------------------------------------------------------------
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: ${{ env.AWS_REGION }}

      # -----------------------------------------------------------------------
      # Paso 4: Login a Amazon ECR
      # -----------------------------------------------------------------------
      # ECR usa tokens temporales (vigencia: 12 horas). Se genera automáticamente
      # via aws ecr get-login-password. No es un password fijo como Docker Hub.
      # -----------------------------------------------------------------------
      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      # -----------------------------------------------------------------------
      # Paso 5: Construir y pushear la imagen a ECR
      # -----------------------------------------------------------------------
      # Se pushea con dos tags:
      #   - latest  → última versión estable
      #   - {sha}   → commit específico (para trazabilidad y rollback)
      # -----------------------------------------------------------------------
      - name: Build, tag, and push image to Amazon ECR
        id: build-image
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          ECR_REPOSITORY: siga-production/${{ matrix.service }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          echo "🚧 Construyendo ${{ matrix.service }}..."
          echo "   Registry: $ECR_REGISTRY"
          echo "   Repositorio: $ECR_REPOSITORY"
          echo "   Tag: $IMAGE_TAG"

          docker build \
            -f ${{ matrix.dockerfile }} \
            -t $ECR_REGISTRY/$ECR_REPOSITORY:latest \
            -t $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG \
            ${{ matrix.context }}

          echo "📤 Pusheando a ECR..."
          docker push --all-tags $ECR_REGISTRY/$ECR_REPOSITORY

          echo "✅ ${{ matrix.service }} desplegado en ECR"
          echo "image=$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG" >> $GITHUB_OUTPUT

  # ===========================================================================
  # Job 2: Deploy a EKS (depende del Job 1)
  # ===========================================================================
  # Este job solo se ejecuta cuando:
  #   - Es un push a main (no a migracion-microservicios)
  #   - O es un dispatch manual con deploy-to-eks = true
  # ===========================================================================
  deploy-to-eks:
    name: Deploy to EKS
    needs: build-and-push
    runs-on: ubuntu-latest
    if: |
      github.ref == 'refs/heads/main'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # -----------------------------------------------------------------------
      # Paso 1: Configurar credenciales AWS
      # -----------------------------------------------------------------------
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: ${{ env.AWS_REGION }}

      # -----------------------------------------------------------------------
      # Paso 2: Configurar kubectl para el cluster EKS
      # -----------------------------------------------------------------------
      - name: Update kubeconfig for EKS
        run: |
          aws eks update-kubeconfig \
            --region ${{ env.AWS_REGION }} \
            --name ${{ env.EKS_CLUSTER_NAME }}

      # -----------------------------------------------------------------------
      # Paso 3: Verificar que podemos comunicarnos con el cluster
      # -----------------------------------------------------------------------
      - name: Verify cluster access
        run: |
          echo "🔌 Verificando conexión al cluster..."
          kubectl cluster-info
          echo ""
          echo "🖥️  Nodos disponibles:"
          kubectl get nodes

      # -----------------------------------------------------------------------
      # Paso 4: Aplicar los manifests de Kubernetes
      # -----------------------------------------------------------------------
      - name: Apply Kubernetes manifests
        run: |
          echo "📦 Aplicando manifests a EKS..."
          kubectl apply -k k8s/
          echo ""
          echo "⏳ Esperando que los pods estén listos..."
          kubectl wait --for=condition=ready pod \
            -l app=siga-gateway -n siga --timeout=120s || true

      # -----------------------------------------------------------------------
      # Paso 5: Forzar rolling update con las nuevas imágenes
      # -----------------------------------------------------------------------
      - name: Rollout restart (new images)
        run: |
          echo "🔄 Forzando rolling update..."
          kubectl rollout restart deployment -n siga
          kubectl rollout status deployment -n siga --timeout=180s || true

      # -----------------------------------------------------------------------
      # Paso 6: Verificar estado final del despliegue
      # -----------------------------------------------------------------------
      - name: Verify deployment
        run: |
          echo "✅ Despliegue completado"
          echo ""
          echo "=== Pods ==="
          kubectl get pods -n siga -o wide
          echo ""
          echo "=== Services ==="
          kubectl get svc -n siga
          echo ""
          echo "=== HPA Status ==="
          kubectl get hpa -n siga
          echo ""
          echo "=== Ingress ==="
          kubectl get ingress -n siga
